# Memgraph 2.22.1 — same pin as docker-compose + CI's memgraph-test
# job. StatefulSet so the PV survives pod restarts; single replica
# because the open-source edition doesn't do replication.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memgraph
  namespace: gmnap
  labels:
    app.kubernetes.io/name: memgraph
    app.kubernetes.io/part-of: gmnap-stack
spec:
  serviceName: memgraph
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: memgraph
  template:
    metadata:
      labels:
        app.kubernetes.io/name: memgraph
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: memgraph
          image: memgraph/memgraph:2.22.1
          args: ["--storage-gc-cycle-sec=30"]
          ports:
            - name: bolt
              containerPort: 7687
          env:
            - name: MEMGRAPH_USER
              valueFrom:
                configMapKeyRef:
                  name: gmnap-config
                  key: MEMGRAPH_USER
            - name: MEMGRAPH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmnap-secrets
                  key: memgraph-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/memgraph
            - name: log
              mountPath: /var/log/memgraph
          # Bolt handshake via mgconsole — the same probe pattern CI
          # uses for the memgraph-test integration job.
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'echo "RETURN 1;" | mgconsole --host localhost --port 7687 --username "$MEMGRAPH_USER" --password "$MEMGRAPH_PASSWORD" || exit 1'
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: log
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: memgraph
  namespace: gmnap
spec:
  clusterIP: None  # headless — StatefulSet pod DNS
  selector:
    app.kubernetes.io/name: memgraph
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687

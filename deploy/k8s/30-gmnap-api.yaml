# gmnap-api Deployment. 3 replicas behind a ClusterIP service.
# SIGTERM drains for up to 60 s before the pod gets reaped — matches
# the uvicorn --timeout-graceful-shutdown=60 in the Dockerfile CMD
# and the stop_grace_period in docker-compose.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmnap-api
  namespace: gmnap
  labels:
    app.kubernetes.io/name: gmnap-api
    app.kubernetes.io/part-of: gmnap-stack
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: gmnap-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0  # zero-downtime rollouts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gmnap-api
    spec:
      terminationGracePeriodSeconds: 120  # > uvicorn graceful shutdown
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gmnap-api
          # Set deploy-time via --set image.tag=… (Helm) or sed
          # before applying (kubectl). Default tag tracks v0.1.0.
          image: ghcr.io/clanclanclanclan/gmnap:v0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gmnap-config
          env:
            - name: MEMGRAPH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmnap-secrets
                  key: memgraph-password
            - name: GMNAP_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: gmnap-secrets
                  key: api-token
                  optional: true
          # /healthz is fast (no DB); /readyz checks Memgraph +
          # genealogy_enrichment.json. Round-34 hardened /readyz so
          # 200 ⟹ traffic-safe.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Drain hook — calling /readyz returning 503 propagates to
          # the lifespan shutdown handler (GMNAP_SHUTTING_DOWN=1)
          # which fast-trips the load balancer's removal of this pod
          # while in-flight requests finish.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "6Gi"  # V7 spec: ≤6 GB RSS
          volumeMounts:
            - name: cache
              mountPath: /app/cache
      volumes:
        - name: cache
          # Empty by default; mount a PVC instead for cost-tracker
          # persistence (see deploy/README.md's prod checklist).
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gmnap-api
  namespace: gmnap
  labels:
    app.kubernetes.io/name: gmnap-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gmnap-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: memgraph
  labels:
    {{- include "gmnap.labels" . | nindent 4 }}
    app.kubernetes.io/name: memgraph
spec:
  serviceName: memgraph
  replicas: 1
  selector:
    matchLabels:
      {{- include "gmnap.memgraphSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gmnap.memgraphSelectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: memgraph
          image: {{ .Values.memgraph.image }}
          args: ["--storage-gc-cycle-sec=30"]
          ports:
            - name: bolt
              containerPort: 7687
          env:
            - name: MEMGRAPH_USER
              valueFrom:
                configMapKeyRef:
                  name: gmnap-config
                  key: MEMGRAPH_USER
            - name: MEMGRAPH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmnap-secrets
                  key: memgraph-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/memgraph
            - name: log
              mountPath: /var/log/memgraph
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'echo "RETURN 1;" | mgconsole --host localhost --port 7687 --username "$MEMGRAPH_USER" --password "$MEMGRAPH_PASSWORD" || exit 1'
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.memgraph.resources | nindent 12 }}
      volumes:
        - name: log
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.memgraph.persistence.storageClass }}
        storageClassName: {{ .Values.memgraph.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.memgraph.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: memgraph
  labels:
    {{- include "gmnap.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "gmnap.memgraphSelectorLabels" . | nindent 4 }}
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687

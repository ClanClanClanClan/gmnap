apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmnap-api
  labels:
    {{- include "gmnap.labels" . | nindent 4 }}
    app.kubernetes.io/name: gmnap-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "gmnap.apiSelectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "gmnap.apiSelectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: gmnap-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gmnap-config
          env:
            - name: MEMGRAPH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmnap-secrets
                  key: memgraph-password
            {{- if .Values.api.bearerTokens }}
            - name: GMNAP_API_TOKENS
              valueFrom:
                secretKeyRef:
                  name: gmnap-secrets
                  key: api-token
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 10"]
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: cache
              mountPath: /app/cache
      volumes:
        - name: cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gmnap-api
  labels:
    {{- include "gmnap.labels" . | nindent 4 }}
    app.kubernetes.io/name: gmnap-api
spec:
  type: ClusterIP
  selector:
    {{- include "gmnap.apiSelectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080

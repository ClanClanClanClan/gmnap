{{- if .Values.memgraph.password }}
apiVersion: v1
kind: Secret
metadata:
  name: gmnap-secrets
  labels:
    {{- include "gmnap.labels" . | nindent 4 }}
type: Opaque
stringData:
  memgraph-password: {{ .Values.memgraph.password | quote }}
  {{- if .Values.api.bearerTokens }}
  api-token: {{ .Values.api.bearerTokens | quote }}
  {{- end }}
{{- else }}
{{ fail "memgraph.password is required. Generate one with `openssl rand -hex 16` and pass via --set memgraph.password=… or your values file." }}
{{- end }}

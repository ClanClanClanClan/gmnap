[tool:pytest]
# Basic configuration
minversion = 6.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add project root to Python path
addopts =
    --strict-config
    --verbose
    --tb=short
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=85
    --durations=10
    --timeout=300
    --maxfail=5
    --capture=no
    --disable-warnings
    -m "not live_api"

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    stress: marks tests as stress tests
    security: marks tests as security tests
    property: marks tests as property-based tests
    integration: marks tests as integration tests
    memory: marks tests as memory-intensive
    live_api: marks tests requiring running HTTP server + database
    paranoid: marks extra-strict security tests

# Test discovery
norecursedirs = .git .tox dist build *.egg cache .pytest_cache __pycache__

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Timeout settings
timeout = 300
timeout_method = thread

# Parallel execution
# Use with: pytest -n auto
# Requires: pip install pytest-xdist

# Coverage settings
# Exclude from coverage
omit = 
    */tests/*
    */test_*
    */conftest.py
    */venv/*
    */env/*
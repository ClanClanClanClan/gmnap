# Diaspora overlay configuration
# Maps country codes to region overrides based on date ranges.
# When a mathematician publishes from a country outside their home region,
# this config determines which region processor to apply.
#
# Format: country -> [{region: code, range: "start-end"}]
# Range: "start-end" where either bound can be empty (unbounded).

# ----- East & Southeast Asia publishing in Anglosphere -----
"TH":
  - {region: "E6", range: "-2015"}
  - {region: "A1", range: "2016-"}

"CN":
  - {region: "E1", range: ""}  # Default: Sinophone mainland
  # Chinese mathematicians with US/UK affiliations use A1 conventions
"TW":
  - {region: "E2", range: ""}  # Traditional Chinese

"KR":
  - {region: "E4", range: ""}  # Korean default

"JP":
  - {region: "E3", range: "-2019"}
  - {region: "E3", range: "2020-"}  # Post-2020 order change (Rule 12)

"VN":
  - {region: "E5", range: ""}

# ----- South Asia publishing internationally -----
"IN":
  - {region: "D1", range: ""}  # Hindi belt default
  # Dravidian states handled by D2 detection based on script/surname

"PK":
  - {region: "D4", range: ""}

"BD":
  - {region: "D3", range: ""}  # Bengali

"LK":
  - {region: "D5", range: ""}  # Sinhala

# ----- Middle East & Central Asia -----

# GMNAP V7 Prometheus Configuration
# Spec §12: Prometheus + Grafana monitoring stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/prometheus_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # Add alertmanager:9093 when deployed

scrape_configs:
  - job_name: "gmnap-api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["gmnap:8080"]
        labels:
          service: "gmnap"
          environment: "production"

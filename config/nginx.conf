# GMNAP V7 Nginx reverse proxy configuration
# Spec section 12: services include nginx
# Loaded as /etc/nginx/conf.d/default.conf (inside http {} block)

# Hide nginx version in responses
server_tokens off;

# Rate limiting zone (free tier: 60 req/min = 1 req/sec)
# This directive is valid in http context (conf.d/ is included within http {})
limit_req_zone $binary_remote_addr zone=free:10m rate=1r/s;

# Gzip compression for JSON API responses
gzip on;
gzip_types application/json text/plain text/css application/javascript;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;

upstream gmnap_api {
    server gmnap:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Request size limit (batch entries can be large)
    client_max_body_size 50m;

    # Health checks - no rate limiting, no auth
    location /healthz {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    # Prometheus metrics - restrict to internal networks
    location /metrics {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # API endpoints - rate limited for free tier
    location /api/ {
        limit_req zone=free burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pipeline processing can take a while for large batches
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Buffer large responses (batch results)
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
    }

    # Static files for web interface
    location /static/ {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    location = / {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    # Deny everything else
    location @fallback {
        return 404 '{"error": "Not found"}';
        default_type application/json;
    }
}

# ── TLS / HTTPS configuration ──────────────────────────────────────
#
# DO NOT deploy GMNAP behind plain HTTP in production. Hashcash
# stamps, X-Request-ID correlation, paid-tier Bearer tokens, and
# the queried names themselves all need to be encrypted in transit.
# The two common provisioning paths:
#
# A. Public hostname + Let's Encrypt (automatic, free, renewing):
#
#    Use the `nginx + certbot` companion pattern. Add a sidecar
#    `certbot` service to docker-compose:
#
#        certbot:
#          image: certbot/certbot
#          volumes:
#            - ./certbot/conf:/etc/letsencrypt
#            - ./certbot/www:/var/www/certbot
#          entrypoint: "/bin/sh -c 'trap exit TERM; while :; do
#                        certbot renew; sleep 12h & wait $${!}; done;'"
#
#    First-time bootstrap (one-shot, before the running stack):
#
#        docker compose run --rm --entrypoint "certbot certonly
#          --webroot -w /var/www/certbot --email you@example.com
#          --agree-tos --no-eff-email -d your-domain.example.com"
#          certbot
#
#    Then uncomment + edit the HTTPS server block below and reload
#    nginx (`docker compose exec nginx nginx -s reload`).
#
# B. Self-signed (internal / behind firewall / staging):
#
#        openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
#          -keyout ./certs/gmnap.key -out ./certs/gmnap.crt \
#          -subj "/CN=gmnap.internal"
#
#    Mount the certs into the nginx container and uncomment the
#    block. Clients will need to trust the self-signed CA — fine
#    for internal use, not for external.
#
# In either case, uncomment the HTTP → HTTPS redirect below to
# stop accepting plaintext on :80 entirely.
#
# server {
#     listen 80;
#     server_name your-domain.example.com;
#     # ACME challenge directory for Let's Encrypt webroot mode
#     location /.well-known/acme-challenge/ {
#         root /var/www/certbot;
#     }
#     # Force HTTPS for everything else
#     location / {
#         return 301 https://$host$request_uri;
#     }
# }
#
# server {
#     listen 443 ssl http2;
#     server_name your-domain.example.com;
#
#     # Path A (Let's Encrypt):
#     ssl_certificate /etc/letsencrypt/live/your-domain.example.com/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/your-domain.example.com/privkey.pem;
#     # Path B (self-signed):
#     # ssl_certificate /etc/ssl/certs/gmnap.crt;
#     # ssl_certificate_key /etc/ssl/private/gmnap.key;
#
#     # Mozilla "intermediate" — broad client compat, modern crypto.
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
#     ssl_prefer_server_ciphers off;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#     ssl_session_tickets off;
#     # HSTS one year + preload eligibility
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
#
#     # Repeat the location / /api/ /static/ /healthz /readyz /metrics
#     # blocks from the HTTP server above, OR factor them into a
#     # snippet and `include /etc/nginx/snippets/gmnap-locations.conf;`
#     # in both server blocks.
# }

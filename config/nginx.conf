# GMNAP V7 Nginx reverse proxy configuration
# Spec §12: services include nginx
# Loaded as /etc/nginx/conf.d/default.conf (inside http {} block)

# Rate limiting zone (free tier: 60 req/min = 1 req/sec)
# This directive is valid in http context (conf.d/ is included within http {})
limit_req_zone $binary_remote_addr zone=free:10m rate=1r/s;

upstream gmnap_api {
    server gmnap:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Request size limit (batch entries can be large)
    client_max_body_size 50m;

    # Health checks — no rate limiting, no auth
    location /healthz {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    # Prometheus metrics — restrict to internal in production
    location /metrics {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
        # Uncomment for production:
        # allow 10.0.0.0/8;
        # allow 172.16.0.0/12;
        # allow 192.168.0.0/16;
        # deny all;
    }

    # API endpoints — rate limited for free tier
    location /api/ {
        limit_req zone=free burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pipeline processing can take a while for large batches
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Buffer large responses (batch results)
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
    }

    # Static frontend (MathLineage web interface)
    location / {
        root /app/static;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

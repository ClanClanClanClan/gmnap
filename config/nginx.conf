# GMNAP V7 Nginx reverse proxy configuration
# Spec §12: services include nginx

upstream gmnap_api {
    server gmnap:8080;
}

server {
    listen 80;
    server_name _;

    # Rate limiting zone (free tier: 60 req/min = 1 req/sec)
    limit_req_zone $binary_remote_addr zone=free:10m rate=1r/s;

    location /healthz {
        proxy_pass http://gmnap_api;
        # No rate limiting on health checks
    }

    location /readyz {
        proxy_pass http://gmnap_api;
    }

    location /metrics {
        proxy_pass http://gmnap_api;
        # Restrict metrics to internal networks in production
        # allow 10.0.0.0/8;
        # deny all;
    }

    location /api/ {
        limit_req zone=free burst=10 nodelay;
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;  # Pipeline processing can be slow
    }

    # Deny everything else
    location / {
        return 404 '{"error": "Not found"}';
        add_header Content-Type application/json;
    }
}

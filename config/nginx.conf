# GMNAP V7 Nginx reverse proxy configuration
# Spec section 12: services include nginx
# Loaded as /etc/nginx/conf.d/default.conf (inside http {} block)

# Hide nginx version in responses
server_tokens off;

# Rate limiting zone (free tier: 60 req/min = 1 req/sec)
# This directive is valid in http context (conf.d/ is included within http {})
limit_req_zone $binary_remote_addr zone=free:10m rate=1r/s;

# Gzip compression for JSON API responses
gzip on;
gzip_types application/json text/plain text/css application/javascript;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;

upstream gmnap_api {
    server gmnap:8080;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # Request size limit (batch entries can be large)
    client_max_body_size 50m;

    # Health checks - no rate limiting, no auth
    location /healthz {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    # Prometheus metrics - restrict to internal networks
    location /metrics {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
    }

    # API endpoints - rate limited for free tier
    location /api/ {
        limit_req zone=free burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pipeline processing can take a while for large batches
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;

        # Buffer large responses (batch results)
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 64k;
    }

    # Static files for web interface
    location /static/ {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    location = / {
        proxy_pass http://gmnap_api;
        proxy_set_header Host $host;
    }

    # Deny everything else
    location @fallback {
        return 404 '{"error": "Not found"}';
        default_type application/json;
    }
}


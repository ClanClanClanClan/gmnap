# D4 Pakistan Urdu Region Configuration
# Urdu: Pakistan and Northern India

schema_version: "7.0"
region_code: "D4"
region_name: "Pakistan Urdu"

# Regional characteristics
iso_territories: [PK, IN]
primary_scripts: ["Arabic", "Latin"]
distinct_features: "Urdu/Arabic script; Persian influences; Islamic naming traditions"

# Processing configuration
canonical_order: "Family, Given"
mixed_scripts: true
romanisation_standards: ["ALA-LC Urdu", "ISO 233", "BGN-PCGN Urdu"]

# Regional processing rules
processing_rules:
  urdu_script_handling: true
  persian_arabic_processing: true
  islamic_tradition_processing: true
  pakistan_regional_processing: true

# Validation thresholds
validation_rules:
  min_confidence: 0.7
  max_length: 150
  require_family_name: true
  allow_single_names: true
  urdu_script_validation: true
  islamic_pattern_validation: true

# Quality control
quality_thresholds:
  detector_confidence_min: 0.5
  processing_accuracy_min: 0.95
  urdu_script_detection_accuracy: 0.89
  transliteration_accuracy: 0.86
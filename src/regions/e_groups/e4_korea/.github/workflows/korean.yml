name: Korean v6 CI gate

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install locked deps
      run: |
        pip install --no-deps -r requirements.lock

    - name: Build FSTs
      run: python scripts/build_fsts_multi.py

    - name: Compute scores
      id: scores
      run: echo "json=$(tools/score.py)" >> $GITHUB_OUTPUT

    - name: Regression gate
      run: |
        python - <<'PY'
        import json, pathlib, sys, os
        base = json.load(open('baseline.json'))
        current = json.loads(os.environ['SCORES'])
        def fail(msg):
            print(f"::error::{msg}")
            sys.exit(1)
        if current["math"][0] < base["math"][0]:
            fail(f"Math score ↓  {current['math'][0]}  <  {base['math'][0]}")
        if current["diverse"][0] < base["diverse"][0]:
            fail(f"Diverse score ↓  {current['diverse'][0]}  <  {base['diverse'][0]}")
        PY
      env:
        SCORES: "${{ steps.scores.outputs.json }}"
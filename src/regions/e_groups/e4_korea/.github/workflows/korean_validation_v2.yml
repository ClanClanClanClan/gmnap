# Korean Regional Processor v2 - Enhanced CI/CD Pipeline
# Addresses audit findings: matrix builds, PyNini caching, Windows support

name: Korean Regional Processor Validation v2
on:
  pull_request:
    paths: 
      - 'resources/rr_syllable_map.csv'
      - 'scripts/**'
      - '.github/workflows/**'
  push:
    branches: [ main, develop ]

jobs:
  validate:
    name: Validate Korean Improvements
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]  # §3.3 - Windows support
        python-version: ['3.9', '3.10', '3.11']
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2  # Need previous commit for diff analysis
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      # §3.2 - Cache PyNini and dependencies to avoid 14-minute builds
      - name: Cache PyNini Installation
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            /usr/local/lib/python*/site-packages/pynini*
            /usr/local/lib/libfst*
          key: ${{ runner.os }}-pynini-${{ matrix.python-version }}-v2
          restore-keys: |
            ${{ runner.os }}-pynini-${{ matrix.python-version }}-
            ${{ runner.os }}-pynini-
      
      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfst-dev libfst-tools
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pynini statsmodels
          pip install -r requirements.txt || echo "No requirements.txt found"
      
      - name: Verify installation
        run: |
          python -c "import pynini; print(f'PyNini {pynini.__version__} ready')"
          python -c "import statsmodels; print('statsmodels ready')"
      
      # Check if this is a mapping file change that needs validation
      - name: Check for mapping changes
        id: check_changes
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q "resources/rr_syllable_map.csv"; then
            echo "mapping_changed=true" >> $GITHUB_OUTPUT
          else
            echo "mapping_changed=false" >> $GITHUB_OUTPUT
          fi
        shell: bash
      
      # §3.1 - Run systematic validation if mapping changed
      - name: Run Systematic Validation
        if: steps.check_changes.outputs.mapping_changed == 'true'
        run: |
          echo "Mapping file changed - running comprehensive validation..."
          python scripts/systematic_improvement_framework_v2.py validate
        shell: bash
      
      # Run basic tests regardless
      - name: Run Basic Validation Tests
        run: |
          # Test framework loading
          python -c "from scripts.systematic_improvement_framework_v2 import SystematicImprovementFrameworkV2; print('Framework v2 loads successfully')"
          
          # Test mapping file integrity
          python -c "
          import csv
          with open('resources/rr_syllable_map.csv', 'r', encoding='utf-8-sig') as f:
              rows = list(csv.reader(f))
              print(f'Mapping file: {len(rows)} rows loaded successfully')
          "
        shell: bash
      
      # §6.3 - Privacy-conscious test output
      - name: Generate Privacy-Safe Test Report
        if: always()
        run: |
          echo "Test completed for ${{ matrix.os }} Python ${{ matrix.python-version }}"
          echo "No sensitive data logged"
        shell: bash

  security-scan:
    name: Security & Privacy Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Scan for PII in logs  # §6.1
        run: |
          # Check improvement logs don't contain raw names
          if find audit/ -name "*.json" -exec grep -l "Kim\|Park\|Lee" {} \; 2>/dev/null | head -1; then
            echo "⚠️  Potential PII found in audit logs"
            echo "Consider implementing name hashing for production"
          fi
      
      - name: Check file permissions
        run: |
          # Verify mapping file is read-only as intended (§1.2)
          if [ -w "resources/rr_syllable_map.csv" ]; then
            echo "⚠️  Mapping file should be read-only"
          fi

  documentation-check:
    name: Documentation & Style Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check documentation consistency  # §7.*
        run: |
          # Check for mixed dashes (§7.1)
          if grep -r "[\u2010\u2011\u2012\u2013\u2014\u2015]" *.md; then
            echo "⚠️  Mixed dash types found - use ASCII minus (-) for code, EN dash (–) for ranges"
          fi
          
          # Check for consistent terminology
          if grep -ri "fst system" *.md | grep -v "FST system"; then
            echo "⚠️  Inconsistent FST capitalization found"
          fi
      
      - name: Validate JSON schema compliance  # §1.6
        run: |
          python -c "
          import json
          import glob
          for f in glob.glob('audit/improvements/*.json'):
              try:
                  with open(f) as file:
                      json.load(file)
                  print(f'✓ {f} valid JSON')
              except Exception as e:
                  print(f'✗ {f} invalid: {e}')
          "
# E6 Mainland SEA Region Processing Rules
# Specialized rules for Thai, Lao, Khmer, and Myanmar naming patterns and scripts

schema_version: "7.0"
region_code: "E6"
region_name: "Mainland Southeast Asia"

# Mainland SEA linguistic rules
linguistic_rules:
  - id: 16
    name: "Unicode Fold Exceptions"  
    description: "Ligatures decomposed; ß/ẞ → ss/SS; tonos=oxia"
    implementation: "unicode_normalization"
    
  - id: 65
    name: "Thai Script Processing"
    description: "Handle Thai abugida script with proper tone marks and vowel signs"
    implementation: "thai_script_processing"
    
  - id: 66
    name: "Lao Script Processing"
    description: "Process Lao abugida script with tone marks and word segmentation"
    implementation: "lao_script_processing"
    
  - id: 67
    name: "Khmer Script Processing" 
    description: "Handle Khmer abugida script with subscript consonants and vowel signs"
    implementation: "khmer_script_processing"
    
  - id: 68
    name: "Myanmar Script Processing"
    description: "Process Myanmar abugida script with circular letters and stacked consonants"
    implementation: "myanmar_script_processing"
    
  - id: 69
    name: "Mainland SEA Romanization"
    description: "Process multiple romanization systems (RTGS, BGN/PCGN, ALA-LC)"
    implementation: "mainland_sea_romanization_processing"

# Mainland SEA specific processing rules
processing_rules:
  mainland_sea_script_handling:
    enabled: true
    primary_scripts: ["Thai", "Lao", "Khmer", "Myanmar"]
    secondary_scripts: ["Latin"]
    character_ranges:
      thai: [0x0E00, 0x0E7F]
      lao: [0x0E80, 0x0EFF]
      khmer: [0x1780, 0x17FF, 0x19E0, 0x19FF]
      myanmar: [0x1000, 0x109F, 0xAA60, 0xAA7F]
    mixed_script_support: true
    script_transitions: "normalize_spacing"
    
  mainland_sea_regional_patterns:
    enabled: true
    territories: ["TH", "LA", "KH", "MM"]
    theravada_buddhist_influences: true
    sanskrit_hindu_elements: true
    royal_naming_traditions: true
    family_given_order: true
    
  thai_processing:
    enabled: true
    character_set: "Thai_Script"
    writing_system: "abugida"
    word_segmentation: "dictionary_based"
    tone_handling: "preserve_tone_marks"
    romanization_standard: "RTGS"
    vowel_signs: "preserve_positioning"
    consonant_clusters: "standard_thai_orthography"
    
  lao_processing:
    enabled: true
    character_set: "Lao_Script"
    writing_system: "abugida"
    word_segmentation: "dictionary_based"
    tone_handling: "preserve_tone_marks"
    romanization_standard: "BGN/PCGN"
    vowel_signs: "preserve_positioning"
    consonant_clusters: "standard_lao_orthography"
    
  khmer_processing:
    enabled: true
    character_set: "Khmer_Script"
    writing_system: "abugida"
    word_segmentation: "space_preservation"
    tone_handling: "no_tones"
    romanization_standard: "ALA-LC"
    subscript_consonants: "preserve_stacking"
    vowel_signs: "preserve_complex_combinations"
    
  myanmar_processing:
    enabled: true
    character_set: "Myanmar_Script"
    writing_system: "abugida"
    word_segmentation: "syllable_breaking"
    tone_handling: "no_tones"
    romanization_standard: "BGN/PCGN"
    circular_letters: "preserve_visual_structure"
    stacked_consonants: "maintain_phonetic_clusters"
    
  thai_family_names:
    enabled: true
    common_surnames: ["สมิท", "จันทร์", "วงศ์", "ทอง", "ศรี", "พร", "สุข", "นาค", "เจริญ", "ปัน"]
    sanskrit_derived: ["ราชกุล", "มหาชัย", "พรหม", "วิษณุ", "อินทร์"]
    royal_surnames: ["จักรี", "มหิดล", "กิติยากร"]
    regional_variations: "preserve_local_patterns"
    historical_names: "preserve_classical_elements"
    
  lao_family_names:
    enabled: true
    patronymic_system: true
    common_patterns: ["ບຸນ", "ທອງ", "ວົງ", "ພອນ", "ນະ", "ສີ"]
    geographic_references: ["ໄຊ", "ພູ", "ນ້ຳ", "ດອນ"]
    buddhist_elements: ["ທຳມະ", "ພຸດທະ", "ສັງຄະ"]
    
  khmer_family_names:
    enabled: true
    clan_names: true
    common_surnames: ["សុខ", "នាង", "ចាន់", "អុក", "គង់", "ស៊ុន"]
    sanskrit_derived: ["បវរ", "ឈុន", "រតន៍", "ធារា", "មុនី"]
    occupational: ["ជាង", "អាចារ្យ", "រាជ", "គ្រូ"]
    
  myanmar_family_names:
    enabled: true
    patronymic_chain: true
    personal_name_system: "individual_names_primary"
    common_elements: ["မင်း", "ဦး", "ဒေါ်", "မ", "ကို", "နု"]
    geographic_origin: ["ရန်ကုန်", "မန္တလေး", "ပျူ", "စစ်ကိုင်း"]
    
  thai_given_names:
    enabled: true
    auspicious_meanings: true
    royal_elements: ["ราช", "เจ้า", "หลวง", "พระ"]
    natural_elements: ["ดาว", "แสง", "น้ำ", "ลม", "ไฟ"]
    buddhist_concepts: ["ธรรม", "กรรม", "บุญ", "สิริ"]
    seasonal_references: ["ฤดู", "ใส", "สาย", "ฝน"]
    
  lao_given_names:
    enabled: true
    buddhist_elements: ["ທຳມະ", "ບຸນ", "ສິນ", "ພອນ"]
    auspicious_meanings: ["ໄຊ", "ສຸກ", "ດີ", "ງາມ"]
    natural_phenomena: ["ແສງ", "ເດືອນ", "ດາວ", "ຟ້າ"]
    
  khmer_given_names:
    enabled: true
    buddhist_concepts: ["ធម៌", "សីល", "ពុទ្ធ", "សង្ឃ"]
    royal_titles: ["រាជ", "ព្រះ", "អង្គ", "នាង"]
    natural_phenomena: ["ចន្ទ", "អាទិត្យ", "ផ្កាយ", "ពពក"]
    virtuous_qualities: ["សុភាព", "គុណ", "ធម៌", "សីល"]
    
  myanmar_given_names:
    enabled: true
    day_of_week: "traditional_naming_system"
    astrological: ["နက္ခတ်", "ဂြိုဟ်", "ရာသီ"]
    buddhist_virtues: ["သီလ", "ဓမ္မ", "မေတ္တာ", "ကရုဏာ"]
    nature_elements: ["သစ်", "ရေ", "လေ", "မီး"]
    
  mainland_sea_romanization:
    enabled: true
    thai_standard: "RTGS"
    lao_standard: "BGN/PCGN"
    khmer_standard: "ALA-LC"
    myanmar_standard: "BGN/PCGN"
    systems:
      rtgs:
        type: "Royal_Thai_General_System"
        official_standard: "Thai_government"
        tone_representation: "no_tone_marks"
      bgn_pcgn:
        type: "Board_Geographic_Names"
        international_standard: "US_UK_agreement"
        phonetic_accuracy: "preserve_pronunciation"
      ala_lc:
        type: "American_Library_Association"
        scholarly_standard: "library_cataloging"
        diacritic_preservation: "full_representation"
        
  name_patterns:
    canonical_order: "Family, Given"
    thai_structure: "given_family_optional"
    lao_structure: "patronymic_system"
    khmer_structure: "family_given_structure"
    myanmar_structure: "personal_name_only"
    generational_markers: "preserve_family_sequences"
    honorific_prefixes: "document_when_present"
    royal_titles: "preserve_hierarchical_indicators"
    
  script_validation:
    script_requirement: "Mainland_SEA_or_Latin"
    validate_native_orthography: true
    allow_original_scripts: true
    allow_romanized_forms: true
    mixed_script_tolerance: "standard"
    character_validity: "strict_unicode_ranges"
    
  cultural_elements:
    enabled: true
    theravada_buddhist: ["พระ", "สงฆ์", "วัด", "บุญ", "กรรม"]
    hindu_sanskrit: ["พระ", "เทพ", "อินทร์", "วิษณุ", "ศิวะ"]
    royal_court: ["ราช", "หลวง", "เจ้า", "พระ", "องค์"]
    natural_world: ["น้ำ", "ไฟ", "ลม", "ดิน", "ฟ้า"]
    seasonal_cycles: ["ฤดู", "ฝน", "แล้ง", "หนาว", "ร้อน"]
    
  historical_periods:
    enabled: true
    angkor_period: "preserve_classical_khmer_elements"
    sukhothai_period: "early_thai_kingdom_patterns"
    ayutthaya_period: "siamese_court_traditions"
    colonial_period: "european_influence_documentation"
    modern_era: "contemporary_naming_trends"
    
  occupational_elements:
    enabled: true
    traditional_occupations: ["ช่าง", "หมอ", "ครู", "พ่อค้า", "เกษตร"]
    religious_roles: ["พระ", "อาจารย์", "หลวงพ่อ", "แม่ชี"]
    royal_court: ["ขุน", "หลวง", "พระยา", "เจ้า"]
    modern_professions: ["แพทย์", "ครู", "วิศวกร", "นักเรียน"]
    
  geographic_elements:
    enabled: true
    preserve_origin_indicators: true
    provincial_markers: true
    city_references: ["กรุงเทพ", "เชียงใหม่", "ขอนแก่น", "หาดใหญ่"]
    river_references: ["แม่น้ำ", "คลอง", "ลำ", "ห้วย"]
    mountain_references: ["ดอย", "เขา", "ภู", "ผา"]
    
  generational_systems:
    enabled: true
    thai_patterns: "preserve_family_naming_traditions"
    lao_patronymic: "maintain_father_name_system"
    khmer_clan_system: "preserve_ancestral_connections"
    myanmar_individual: "respect_personal_name_tradition"
    birth_order_indicators: "preserve_sibling_sequences"
    
  linguistic_features:
    enabled: true
    tonal_languages: ["Thai", "Lao"]
    non_tonal_languages: ["Khmer", "Myanmar"]
    word_boundaries: "script_specific_handling"
    phonetic_patterns: "preserve_in_romanization"
    sound_symbolism: "preserve_cultural_associations"
    
  honorific_systems:
    enabled: true
    thai_honorifics: ["คุณ", "ท่าน", "พ่อ", "แม่", "ลุง", "ป้า"]
    royal_honorifics: ["พระ", "เจ้า", "ฟ้า", "หม่อม"]
    buddhist_titles: ["หลวงพ่อ", "พระอาจารย์", "แม่ชี"]
    professional_titles: ["หมอ", "ครู", "อาจารย์", "ผู้จัดการ"]
    age_respect_markers: "preserve_social_hierarchy"
    
  dialectal_variations:
    enabled: true
    northern_thai: "preserve_lanna_characteristics"
    northeastern_thai: "isan_dialect_patterns"
    southern_thai: "preserve_regional_variations"
    central_lao: "vientiane_standard_forms"
    northern_khmer: "preserve_regional_characteristics"
    
  orthography_handling:
    preserve_original: true
    create_romanized_variants: true
    handle_native_punctuation: true
    spacing_normalization: "script_appropriate"
    traditional_writing_systems: "document_when_relevant"
    
  modern_adaptations:
    enabled: true
    international_names: "adapt_to_local_phonology"
    technology_influences: "document_digital_age_patterns"
    globalization_effects: "preserve_cultural_identity"
    foreign_name_adaptation: "standard_phonetic_rules"

# Quality thresholds for E6
quality_thresholds:
  confidence_threshold: 0.7
  processing_accuracy: 0.90
  script_detection_accuracy: 0.92
  romanization_accuracy: 0.85
  thai_script_recognition: 0.90
  lao_script_recognition: 0.88
  khmer_script_recognition: 0.87
  myanmar_script_recognition: 0.85

# Error handling
error_handling:
  invalid_characters: "reject"
  malformed_compounds: "preserve_as_single"
  ambiguous_romanizations: "prefer_standard_system"
  unknown_script_readings: "preserve_with_phonetic_guide"
  script_conflicts: "prefer_native_original"
  mixed_script_validation: "lenient_for_international_names"
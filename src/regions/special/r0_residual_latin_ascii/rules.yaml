# R0 Residual Latin-ASCII Region Processing Rules
# Minimal processing rules for catch-all bucket

schema_version: "7.0" 
region_code: "R0"
region_name: "Residual Latin-ASCII"

# Minimal linguistic rules for catch-all processing
linguistic_rules:
  - id: 16
    name: "Unicode Fold Exceptions"
    description: "Ligatures decomposed; ß/ẞ → ss/SS; tonos=oxia"
    implementation: "unicode_normalization"

# Minimal processing rules
processing_rules:
  name_patterns:
    basic_latin_only: true
    minimal_particle_handling: false
    simple_ordering: "family_given"
    no_complex_variants: true
    
  script_handling:
    allowed_scripts: ["Latin", "ASCII"]
    reject_diacritics: false  # Accept but don't process specially
    basic_normalization_only: true
    
  validation_rules:
    minimal_checks: true
    length_limits:
      min_length: 1
      max_length: 200
    character_validation: "basic_latin_ascii"
    
  normalization:
    unicode_form: "NFC" 
    case_handling: "preserve"
    whitespace_normalization: "single_space"
    remove_control_characters: true
    
  variant_generation:
    create_ascii_variants: false
    particle_variants: false
    order_variants: false
    
# Quality thresholds (very permissive)
quality_thresholds:
  processing_confidence: 0.5
  validation_confidence: 0.3
  
# Error handling (very permissive)
error_handling:
  validation_failure: "accept_anyway"
  processing_error: "minimal_cleanup_and_accept"
  unknown_character: "preserve"
  script_violation: "coerce_to_ascii"

# Fallback rules when all else fails
fallback_rules:
  default_family_name_type: "surname"
  default_script: "Latin"
  minimal_metadata_required: true
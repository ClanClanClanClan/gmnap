# C9 Caucasus Turkic Region Processing Rules
# Specialized rules for Caucasus Turkic naming patterns

schema_version: "7.0"
region_code: "C9"
region_name: "Caucasus Turkic"

# Caucasus Turkic linguistic rules
linguistic_rules:
  - id: 16
    name: "Unicode Fold Exceptions"  
    description: "Ligatures decomposed; ß/ẞ → ss/SS; tonos=oxia"
    implementation: "unicode_normalization"
    
  - id: 27
    name: "Turkic Script Processing"
    description: "Handle mixed Latin/Cyrillic scripts for Turkic languages"
    implementation: "turkic_mixed_script_processing"
    
  - id: 42
    name: "Caucasus Turkic Variations"
    description: "Process Caucasus-specific Turkic dialect and naming patterns"
    implementation: "caucasus_turkic_processing"

# Caucasus Turkic specific processing rules
processing_rules:
  mixed_script_handling:
    enabled: true
    primary_scripts: ["Latin", "Cyrillic"]
    script_preference: "context_dependent"
    normalization_form: "NFKC"
    handle_script_switching: true
    
  caucasus_turkic_patterns:
    enabled: true
    dialects: ["Karachay", "Balkar", "Kumyk", "Nogai"]
    mountain_communities: true
    historical_migrations: true
    
  karachay_balkar_patterns:
    enabled: true
    territories: ["RU"]  # North Caucasus
    cyrillic_script_primary: true
    mountain_clan_names: true
    traditional_suffixes: ["-оглу", "-кызы"]  # Turkic patronymics
    
  kumyk_patterns:
    enabled: true
    territories: ["RU"]  # Dagestan
    cyrillic_script_usage: true
    plain_mountain_distinctions: true
    shamhal_historical_titles: true
    
  nogai_patterns:
    enabled: true
    territories: ["RU"]  # Various regions
    nomadic_heritage_names: true
    horde_affiliations: true
    historical_migration_patterns: true
    
  turkic_transliteration:
    enabled: true
    primary_standard: "ALA-LC Turkic"
    alternative_standards: ["ISO 9", "BGN-PCGN"]
    preserve_original: true
    create_variants: true
    handle_vowel_harmony: true
    handle_consonant_mutations: true
    
  patronymic_systems:
    enabled: true
    turkic_patronymics: ["-оглу", "-огли", "-кызы"]  # Son of, daughter of
    russian_adaptations: ["-ов", "-ова", "-ев", "-ева"]
    preserve_turkic_forms: true
    handle_mixed_patronymics: true
    
  name_patterns:
    canonical_order: "Family, Given"
    turkic_given_names: "preserve_original"
    clan_surnames: "preserve_with_markers"
    occupational_surnames: true
    geographic_surnames: true
    
  script_validation:
    script_requirement: "Latin_or_Cyrillic"
    allow_script_mixing: "limited"
    validate_turkic_orthography: true
    cyrillic_preference_regions: ["RU"]
    latin_preference_regions: []
    
  historical_patterns:
    enabled: true
    soviet_period_adaptations: true
    pre_soviet_traditional_names: true
    post_soviet_revivals: true
    russian_empire_influences: true
    
  clan_tribal_patterns:
    enabled: true
    preserve_clan_affiliations: true
    mountain_clan_structures: true
    nomadic_tribal_names: true
    genealogical_markers: ["-тукум", "-тайпа"]
    
  religious_elements:
    enabled: true
    islamic_naming_traditions: true
    sufi_influences: "moderate"
    preserve_religious_titles: true
    islamic_patronymics: true
    
  geographic_markers:
    enabled: true
    preserve_origin_indicators: true
    mountain_valley_names: true
    settlement_indicators: ["-лы", "-лу", "-ли"]
    river_names: ["-су", "-чай"]
    
  linguistic_features:
    enabled: true
    vowel_harmony_processing: true
    consonant_assimilation: true
    turkic_phonetic_changes: true
    loan_word_adaptations: true
    
  orthography_handling:
    preserve_original: true
    create_transliterated_variants: true
    handle_cyrillic_variants: true
    handle_latin_variants: true
    soviet_orthographic_changes: "document_historical"

# Quality thresholds for C9
quality_thresholds:
  confidence_threshold: 0.7
  processing_accuracy: 0.95
  script_detection_accuracy: 0.85
  transliteration_accuracy: 0.83
  dialect_recognition_accuracy: 0.78

# Error handling
error_handling:
  invalid_characters: "reject"
  malformed_compounds: "preserve_as_single"
  ambiguous_transliterations: "prefer_ala_lc"
  unknown_dialect_patterns: "accept_with_standard_turkic_processing"
  script_conflicts: "prefer_context_appropriate"
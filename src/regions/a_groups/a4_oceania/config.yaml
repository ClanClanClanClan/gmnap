# A4 Oceania Island States Region Configuration
# Oceania: FJ, PG, SB, VU, WS, TO, KI, TV, NR, CK, NU, PF, NC

schema_version: "7.0"
region_code: "A4"
region_name: "Oceania Island States"

# Regional characteristics
iso_territories: [FJ, PG, SB, VU, WS, TO, KI, TV, NR, CK, NU, PF, NC]
primary_scripts: ["Latin with macrons"]
distinct_features: "Polynesian macron restoration"

# Processing configuration
canonical_order: "Family, Given"
mixed_scripts: false
romanisation_standards: []

# Regional processing rules
processing_rules:
  polynesian_macron_restoration: true
  pacific_island_patterns: true
  melanesian_name_handling: true
  micronesian_conventions: true

# Validation thresholds
validation_rules:
  min_confidence: 0.7
  max_length: 150
  require_family_name: true
  allow_single_names: false
  macron_validation: true
  polynesian_pattern_validation: true

# Quality control
quality_thresholds:
  detector_confidence_min: 0.5
  processing_accuracy_min: 0.95
  macron_restoration_accuracy: 0.9
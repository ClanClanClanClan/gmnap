# A3 Nordic-Baltic Region Processing Rules
# Specialized rules for Nordic-Baltic naming patterns

schema_version: "7.0"
region_code: "A3"
region_name: "Nordic-Baltic"

# Nordic-Baltic linguistic rules
linguistic_rules:
  - id: 8
    name: "Icelandic Patronymic"
    description: "FamilyNameType=patronymic; excluded from collisions"
    implementation: "patronymic_processing"
    
  - id: 16
    name: "Unicode Fold Exceptions"  
    description: "Ligatures decomposed; ß/ẞ → ss/SS; tonos=oxia"
    implementation: "unicode_normalization"

# Nordic-Baltic specific processing rules
processing_rules:
  icelandic_patronymic:
    enabled: true
    patronymic_suffixes: ["son", "dóttir", "sen", "datter"]
    family_name_type: "patronymic"
    exclude_from_collisions: true
    preserve_original_form: true
    
  scandinavian_names:
    enabled: true
    compound_surnames: true
    hyphenated_given_names: true
    diacritic_variants: ["å", "ä", "ö", "æ", "ø", "ü", "õ"]
    
  baltic_patterns:
    enabled: true
    lithuanian_endings: ["as", "ys", "ius", "ė", "aitė", "utė", "ienė"]
    latvian_endings: ["s", "š", "is", "us", "a", "e"]
    estonian_patterns: "finnic_rules"
    
  finnish_names:
    enabled: true
    compound_surnames: true
    patronymic_rare: true
    vowel_harmony: "preserve"
    
  name_patterns:
    comma_separation: "Family, Given"
    multiple_given_names: "preserve_all"
    compound_surnames: "detect_and_preserve"
    patronymic_detection: "icelandic_specific"
    
  script_validation:
    script_requirement: "Latin_Extended"
    allow_diacritics: true
    validate_language_specific: true
    nordic_specific_chars: true
    
  diacritic_handling:
    preserve_original: true
    create_ascii_variants: true
    normalization_form: "NFC"
    nordic_ligatures: "preserve_å_æ_ø"

# Quality thresholds for A3
quality_thresholds:
  confidence_threshold: 0.7
  processing_accuracy: 0.95
  patronymic_detection_accuracy: 0.9
  diacritic_handling_accuracy: 0.92

# Error handling
error_handling:
  invalid_characters: "reject"
  malformed_patronymics: "preserve_as_surname"
  ambiguous_diacritics: "prefer_original_form"
  unknown_baltic_endings: "accept_with_variants"
# A2 Western Europe Region Configuration
# Western Europe: FR, DE, IT, ES, PT, NL, BE, CH, AT, LU, etc.

schema_version: "7.0"
region_code: "A2"
region_name: "Western Europe"

# Regional characteristics
iso_territories: [FR, DE, IT, ES, PT, NL, BE, CH, AT, LU, LI, SM, MC, GI, AD, MT, VA]
primary_scripts: ["Latin with diacritics"]
distinct_features: "Iberian dual surnames; de/von/van particles"

# Processing configuration
canonical_order: "Family, Given"
mixed_scripts: false
romanisation_standards: []

# Regional processing rules
processing_rules:
  iberian_dual_surnames: true
  particle_processing: true
  diacritic_preservation: true
  multi_language_support: true

# Validation thresholds
validation_rules:
  min_confidence: 0.7
  max_length: 150
  require_family_name: true
  allow_single_names: false
  diacritic_validation: true

# Quality control
quality_thresholds:
  detector_confidence_min: 0.5
  processing_accuracy_min: 0.95
  particle_detection_accuracy: 0.9
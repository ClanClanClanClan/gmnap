  - {tier: 0, service: OpenAlex,              key: OpenAlex,      licence: CC0,            daily_quota: 864000}
  - {tier: 0, service: Crossref,              key: Crossref,      licence: CC0,            daily_quota: 4300000}
  - {tier: 0, service: ORCID_ETD,             key: ORCID_ETD,     licence: CC0,            daily_quota: 100000}
  - {tier: 0, service: Crossref_Thesis,       key: CrossrefThesis,licence: CC0,            daily_quota: 100000}
  # Tier 1
  - {tier: 1, service: Wikidata_P184,         key: WD_Genealogy,  licence: CC0,            daily_quota: dump}
  - {tier: 1, service: OAI_University,        key: OAI_ETD,       licence: Mixed,          daily_quota: dump}
  - {tier: 1, service: HAL,                   key: HAL,           licence: CC‑BY,          daily_quota: 86400}
  - {tier: 1, service: GND,                   key: GND,           licence: CC‑BY,          daily_quota: unlimited}
  - {tier: 1, service: zbMATH Open,           key: zbMATH,        licence: CC‑BY,          daily_quota: 200}

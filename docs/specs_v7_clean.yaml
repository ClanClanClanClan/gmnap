# ---------------------------------------------------------------------
# 10 · SECURITY & LEGAL
# ---------------------------------------------------------------------
security_legal:
  personal_data_policy: "Identifiers only; GDPR request → ShadowNode"
  gdpr_flag: "GDPR_DATA fields; --drop-personal inserts ShadowNode"
  licence_tiers: ["public_cc0", "redistributable_cc-by", "non-redistributable"]
  scrubbers: [ProQuest, Google Scholar, CNKI]
  birth_year_privacy: "Decade‑granular if local cohort < 5"
  doi_provider: "ETH‑Bibliothek"
  archive_provider: "ETH Data Archive"
  google_scholar_optin: "--force-extreme + YES_I_ACCEPT_GS_TOS=yes; encrypted cache"
  attribution_file: "ATTRIBUTION.txt auto‑generated (SPDX mapping)"

# ---------------------------------------------------------------------
# 11 · DEVELOPER TOOLING
# ---------------------------------------------------------------------
developer_tooling:
  dev_container:
    base: "ubuntu:22.04"
    python: "3.12"
    duckdb: "0.10"
    memgraph: "2.12"
    ruamel_yaml: "0.18"
    fasttext: "scripted install"
    zstandard: "CLI"
  pre_commit:
    - {repo: "https://github.com/psf/black",        rev: 24.3.0, hooks: [black]}
    - {repo: "https://github.com/astral-sh/ruff-pre-commit", rev: v0.4.0, hooks: [ruff]}
    - {repo: "https://github.com/PyCQA/isort",      rev: 5.13.2, hooks: [isort]}
    - {repo: "https://github.com/codespell-project/codespell", rev: v2.2.5, hooks: [codespell]}
    - {repo: "https://github.com/adrienverge/yamllint.git",    rev: v1.35.1, hooks: [yamllint]}
  make_targets: [quick, full, extreme, test, lint, cost‑check, update‑sources]
  cli_examples:
    query:   'gmnap query "Euler, Leonhard"'
    lineage: 'gmnap lineage --id <GlobalID> --depth 3 --format svg'
  vscode_extension:
    version: "0.3.0"
    features: [syntax_highlight, schema_validation, formatter_toggle_narrow_nbsp]

# ---------------------------------------------------------------------
# 12 · OPS & MONITORING
# ---------------------------------------------------------------------
ops:
  container_runtime: "Docker Compose"
  services: ["api", "memgraph", "duckdb-batch", "redis", "nginx"]
  backups:
    frequency: "daily"
    retention_days: 30
    offsite: "ETH Data Archive"
  monitoring:
    stack: "Prometheus + Grafana"
    alert_rule: "p95 latency > 2× baseline for 15 min"
  rate_limit:
    free_tier: {requests_per_min: 60, hashcash_bits: 18}
    paid_tier: {requests_per_min: 10000, auth_scheme: "Bearer"}

# ---------------------------------------------------------------------
# 13 · ROADMAP

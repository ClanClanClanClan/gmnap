spec_version: "7"
published: "2025-07-18"
yaml_record_schema_version: "2.0"        # new objects → bump
schema_version: "7.0"                    # mandatory in every fragment

# ---------------------------------------------------------------------
# 0 · GLOBAL CONSTANTS & RUNTIME PARAMETERS
# ---------------------------------------------------------------------
streaming_chunk_size: 8000
peak_memory_limit: "6GB RSS"
snapshot_retention_days: 3650            # 10 years
cost_cap_chf_per_month: 120

graph_db:
  engine: "memgraph-ce"
  docker_image: "memgraph/memgraph-platform:2.12"
  bolt_port: 7687
  data_dir: "/var/lib/memgraph"

doi_minting:
  provider: "ETH‑Bibliothek (DataCite)"
  shoulder: "10.3929/ethz-lineage"
  registration_mode: "draft"

archive:
  provider: "ETH Data Archive"
  path: "/lineage_snapshots"
  protocol: "SFTP"

cache:
  compression: "zstd"
  max_gb: 50
  max_days: 60
  google_scholar_dir: "cache/gs"

llm_extract:
  engine: "gpt-4o-mini"
  cost_cap_chf_per_month: 40
  max_pdf_pages: 400
  json_schema_inline:
    $schema: "https://json-schema.org/draft/2020-12/schema"
    title: "ETD‑LLM‑Output"
    type: "object"
    required: ["title", "authors", "advisors", "degree_date", "institution"]
    additionalProperties: false
    properties:
      title:        {type: "string", minLength: 2}
      authors:      {type: "array",  items: {type: "string"}, minItems: 1}
      advisors:     {type: "array",  items: {type: "string"}, minItems: 1}
      degree_date:  {type: "string", pattern: "^[0-9]{4}(-[0-9]{2}){0,2}$"}
      degree:       {type: "string"}
      institution:  {type: "string"}
      language:     {type: "string", maxLength: 16}

# ---------------------------------------------------------------------
# 1 · GLOSSARY
# ---------------------------------------------------------------------
glossary:
  - term: Entry
    definition: One mathematician’s authority record (all names, identifiers, metadata).
  - term: CanonicalLatin
    definition: Preferred Latin‑script form in “Family, Given” order.
  - term: CanonicalNative
    definition: Authoritative form in the author’s own script; equals CanonicalLatin if author publishes only in Latin script.
  - term: Variant-Observed
    definition: Object {str, source, accessed} exactly as seen in an external source.
  - term: Variant-Synthesised
    definition: Object {str, type} with type ∈ {ascii-lossy, tone-number, diac-drop, order-swap, romanisation-alt, particle-drop, initial-collapse}.
  - term: FamilyNameType
    definition: Enumerated: surname (default), patronymic, mononym.
  - term: GlobalID
    definition: |
      128‑bit truncated SHA‑256 (22 Base32) of {CanonicalNative, BirthYear?, DeathYear?}.
      Collisions are suffixed “--1, --2 …”, and such suffixed IDs **pass** the duplicate_global_id gate.
  - term: MSC
    definition: Object {code: 5‑digit string, source: authority}.
  - term: NameEvent
    definition: {type, year, from, to} with type ∈ {marriage, religious, passport, transition, legal_change, alias}.
  - term: LanguageOfPublication
    definition: ISO 639‑3 list (≤ 10 codes).
  - term: AffiliationTimeline
    definition: Optional list of {country, from, to} used for diaspora disambiguation.
  - term: Confidence
    definition: 0–100 score; weights stored in config/weights.yaml and must sum to 1.
  - term: Gender
    definition: Enumerated: male, female, nonbinary, unspecified. Boolean GenderProvided records self‑declaration.
  - term: PipelineModes
    definition: Quick – tier‑0; Full – tier‑0+1; Extreme – Full+tier‑2‑3 (requires --force‑extreme).
  - term: CatchAllGroup_R0
    definition: Residual bucket for unmapped ISO codes or detector confidence < 50 %.
  - term: ShortFormClusters
    definition: Map {short_form → count} where count = number of distinct external occurrences.
  - term: GDPR_DATA
    definition: Field‑level boolean for personal data under GDPR.
  - term: GenealogyRelation
    definition: |
      {source_id, target_id, relation_type, qualifier?, confidence};
      relation_type ∈ {doctoralAdvisor, adviserCommitteeMember, postdocMentor, habilitationAdvisor}.
  - term: DegreeDate
    definition: {date: YYYY‑MM‑DD, precision: {year, month, day}}.
  - term: ShadowNode
    definition: Tomb‑stone placeholder for GDPR‑erased persons.
  - term: BetweennessScore
    definition: Edge‑betweenness centrality normalised 0–1.


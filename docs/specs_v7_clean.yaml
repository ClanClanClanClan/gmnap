# ---------------------------------------------------------------------
# 3 · DIASPORA OVERLAY SCHEMA
# ---------------------------------------------------------------------
diaspora_overlay_schema: |
  # File: config/diaspora.yaml
  # Each entry:
  #   - region: <region_code>
  #     range:  <ISO‑8601 interval>   # "..2015", "2016..", or "1980..2000"
  # Ranges for a given ISO country must not overlap.

# ---------------------------------------------------------------------
# 4 · LINGUISTIC RULES (IDs 1‑34, unchanged)
# ---------------------------------------------------------------------
linguistic_rules:
  - {id: 1,  description: "Iberian Dual Surname Split – stop‑words yield primary and secondary surnames."}
  - {id: 2,  description: "Arabic al‑ Article – root normalisation; sun‑letter assimilation; article dropped in order_key."}
  - {id: 3,  description: "Arabic bin/bint – patronymic; removed from order_key."}
  - {id: 4,  description: "Vietnamese Tone Handling – full, ASCII and numeric‑tone variants."}
  - {id: 5,  description: "Kazakh Script Switch – ≥ 2027 Latin; earlier Cyrillic (config/script_switch.yaml)."}
  - {id: 6,  description: "Turkish İ/i ambiguity – dotted and dotless variants for ASCII."}
  - {id: 7,  description: "Persian Ezafe – -e/-ye ignored in order_key."}
  - {id: 8,  description: "Icelandic Patronymic – FamilyNameType=patronymic; excluded from collisions."}
  - {id: 9,  description: "East‑Slavic Patronymic – strip middle token; gender inference."}
  - {id: 10, description: "Hungarian Name Order – generate both native and Western orders."}
  - {id: 11, description: "CJK Round‑Trip – romanise+back‑convert; ≥ 97 % match (Dice coefficient after NFC casefold)."}
  - {id: 12, description: "Japanese Post‑2020 Order Rule – majority rule for English papers."}
  - {id: 13, description: "Korean Hyphen/Space – variant set; order_key collapsed."}
  - {id: 14, description: "Mononyms – FamilyNameType=mononym; initials clustering skipped."}
  - {id: 15, description: "Germanic Particles – von/van/de dropped (except d’)."}
  - {id: 16, description: "Unicode Fold Exceptions – ligatures decomposed; ß/ẞ → ss/SS; tonos=oxia."}
  - {id: 17, description: "Iberian Honorific Strip – Dr., D., Dª removed."}
  - {id: 18, description: "Anglo Middle‑Initial Collapse – John C. clusters with John (hyphenated initials handled)."}
  - {id: 19, description: "Greek Χατζη‑ variants → Haji‑, Hatzi‑."}
  - {id: 20, description: "Turkic -oğlu/-ogly – moved to patronymic; omitted in key."}
  - {id: 21, description: "-zadeh Suffix – kept; hyphen preserved."}
  - {id: 22, description: "French d’ particle – retained in order_key."}
  - {id: 23, description: "SSA Hyphenated Given Names – initials logic."}
  - {id: 24, description: "Russian Transliteration – GOST 7.79‑2000 (A) & BGN‑PCGN 1947 variants."}
  - {id: 25, description: "Greek Ancient Names – Latinised canonical; excluded from modern collisions."}
  - {id: 26, description: "Gender Heuristic Guard – applied only at ≥ 95 % validation accuracy."}
  - {id: 27, description: "Mainland SEA Romanisation – Thai RTGS, Khmer UNGEGN, Lao MOICT 2019; ASCII variants."}
  - {id: 28, description: "Malay bin/binti – patronymic stripped; stored in extras."}
  - {id: 29, description: "Indonesian Mononyms – one‑token canonical."}
  - {id: 30, description: "Filipino Maternal Middle Name – stored as secondary_surname."}
  - {id: 31, description: "Pacific Macron Restore – macronised Māori/Samoan/Tongan forms."}
  - {id: 32, description: "Ibn/Abu/Um Prefixes – dropped when next token length ≥ 3."}
  - {id: 33, description: "Capital Sharp‑S Handling – uppercase ẞ preserved; SS variants added."}
  - {id: 34, description: "Round‑trip Determinism – reciprocal transform restores original CanonicalLatin exactly."}

# ---------------------------------------------------------------------
# 5 · PROCESSING PIPELINE
# ---------------------------------------------------------------------
processing_pipeline:
  - {stage: 0,  name: "Config",             operations: "Load specs; verify licences; DOI credentials"}
  - {stage: 1,  name: "Ingest",             operations: "Read YAML; Unicode NFC→NFKD→fold→NFC"}
  - {stage: 1b, name: "LLMExtract_ETD",     operations: "Parse thesis PDFs with GPT‑4o‑mini; validate JSON; cache"}
  - {stage: 2,  name: "DetectRegion",       operations: "Script, ICU, fastText, affiliation, DOI prefix, diaspora overlay"}
  - {stage: 3,  name: "RegionHooks",        operations: "clean→augment→validate→order_key (immutable except RegionalExtras)"}
  - {stage: 4,  name: "AuthorityEnrich",    operations: "Fetch ORCID_ETD, Crossref_Thesis, Wikidata_P184, OAI_University"}
  - {stage: 5,  name: "CollisionAnalytics", operations: "DuckDB; suffix duplicates; write GenealogyRelation edges"}
  - {stage: 6,  name: "GraphConsistency",   operations: "Betweenness; Bayesian confidence; reject cycles <3"}
  - {stage: 7,  name: "TagShortForms",      operations: "Populate ShortFormClusters"}
  - {stage: 8,  name: "GlobalValidate",     operations: "JSON‑Schema; transliteration round‑trip; graph coherence gate"}
  - {stage: 9,  name: "Write&Diff",         operations: "Deterministic YAML; HTML diff; SQL changelog"}
  - {stage: 10, name: "Report",             operations: "Markdown metrics; draft DOI; push snapshot to archive"}
  - {stage: 11, name: "IdempotencyCheck",   operations: "Rerun pipeline; diff; assert identical"}

# ---------------------------------------------------------------------
# 6 · RUNTIME PROFILES
# ---------------------------------------------------------------------
runtime_profiles:
  - {mode: Quick,    apis: tier‑0,        cpu_workers: 4,  runtime_per_1M: "≤ 35 min"}
  - {mode: Full,     apis: tier‑0+1,      cpu_workers: 8,  runtime_per_1M: "≤ 70 min"}
  - {mode: Extreme,  apis: Full+tier‑2‑3, cpu_workers: 12, runtime_per_1M: "no SLA"}

# ---------------------------------------------------------------------
# 7 · QUALITY GATES
# ---------------------------------------------------------------------
quality_gates:
  duplicate_global_id:            {quick: 0,               full: 0,     extreme: 0}
  duplicate_external_id_pct:      {quick_max: 0.10,        full_max: 0.05, extreme_max: 0}
  roundtrip_script_rate_min:      0.97
  genealogy_edge_conflict_pct:    {quick_max: 2.0,         full_max: 1.0, extreme_max: 0.0}
  graph_coherence_score_min:      {quick: 0.85,            full: 0.92,   extreme: 0.97}
  peak_rss_gb_on_2M:              6
  warm_cache_runtime_per_1M_min:  {quick: 35,              full: 70}
  idempotent_diff_bytes_max:      0

# ---------------------------------------------------------------------
# 8 · TESTING SUITE
# ---------------------------------------------------------------------
testing_suite:
  unit: "region hooks, schema, bayesian scorer"
  property: "diacritic‑fold idempotence, LLM JSON schema"
  fixtures: 1500
  sea_roundtrip: "Thai, Khmer, Lao"
  concurrency: "10‑proc stress"
  memory_peak: "RSS limit"
  lineage_graph_coherence: "betweenness‑scaled confidence ≥ gate"
  snapshot_rollback: "git revert HEAD~1 restores coherence"
  stress: "2M synthetic weekly"
  integration: "live API smoke; OFFLINE=1 skips"
  secret_scan: "trufflehog"
  cost_guard: "fail CI if OpenAI spend > CHF 120"

# ---------------------------------------------------------------------
# 9 · AUTHORITY SOURCES
# ---------------------------------------------------------------------
authority_sources:

# ----------------------------------------------------------------
# 10. SECURITY & LEGAL
# ----------------------------------------------------------------
security_legal:
  personal_data_policy: "Identifiers only; proprietary metadata not published."
  gdpr_flag: "GDPR_DATA per field; --drop-personal removes keys entirely (not null)."
  scrubbers: [CNKI, Magiran, RSL]
  birth_year_privacy: "Decade‑granular if local cohort < 5."
  license_restrictions_file: "LICENSE_RESTRICTIONS.md autogenerated."
  license_matrix_file: "licenses.yaml"
  google_scholar_optin: "--force-extreme + YES_I_ACCEPT_GS_TOS=yes; cache encrypted under cache/gs"
  attribution: "ATTRIBUTION.txt autogenerated incl. SPDX identifiers"

# ----------------------------------------------------------------
# 11. DEVELOPER TOOLING
# ----------------------------------------------------------------
developer_tooling:
  dev_container:
    base: "Ubuntu 22.04"
    python: "3.12"
    duckdb: "0.10"
    ruamel_yaml: "0.18"
    fasttext: "installed via scripts/get_fasttext.sh"
    zstandard: "CLI"
  pre_commit:
    - repo: https://github.com/psf/black
      rev: 24.3.0
      hooks: [black]
    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.4.0
      hooks: [ruff]
    - repo: https://github.com/PyCQA/isort
      rev: 5.13.2
      hooks: [isort]
    - repo: https://github.com/codespell-project/codespell
      rev: v2.2.5
      hooks: [codespell]
    - repo: https://github.com/adrienverge/yamllint.git
      rev: v1.35.1
      hooks: [yamllint]
  make_targets: [quick, full, extreme, test, lint, update-sources]
  dictionaries: tools/dictionaries/<region>.txt
  cli:
    query: 'gmnap query "<surname, given>"'
    diff:  'gmnap diff --author <GlobalID>'
  vscode_extension:
    delivery_month: 5
    features:
      - syntax highlighting
      - schema validation
      - formatter (optionally) inserts U+202F before initials


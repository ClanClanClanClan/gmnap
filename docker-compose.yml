version: '3.8'

services:
  # Memgraph graph database for academic genealogy
  memgraph:
    image: memgraph/memgraph-platform:2.12
    container_name: gmnap_memgraph
    ports:
      - "7687:7687"  # Bolt protocol
      - "7444:7444"  # HTTPS for Memgraph Lab
      - "3000:3000"  # HTTP for Memgraph Lab
    environment:
      - MEMGRAPH_USER=gmnap
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-v7_lineage}
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
      - memgraph_etc:/etc/memgraph
      - ./init_memgraph.cypher:/var/lib/memgraph/init.cypher:ro
    command: ["--init-file=/var/lib/memgraph/init.cypher", "--storage-gc-cycle-sec=30"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | /usr/lib/memgraph/mgconsole --host localhost --port 7687 --username gmnap --password v7_lineage || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for rate limiting state and session caching (V7 spec §12)
  redis:
    image: redis:7-alpine
    container_name: gmnap_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Nginx reverse proxy (V7 spec §12)
  nginx:
    image: nginx:1.25-alpine
    container_name: gmnap_nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gmnap
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  # GMNAP V7 API + Pipeline service
  gmnap:
    build: .
    container_name: gmnap_api
    environment:
      - PIPELINE_MODE=quick
      - CACHE_MAX_SIZE_GB=20
      - CACHE_MAX_DAYS=30
      - PYTHONPATH=/app/src:/app
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
      - MEMGRAPH_USER=gmnap
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-v7_lineage}
      - MEMGRAPH_BOLT=bolt://memgraph:7687
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./config:/app/config
      - ./output:/app/output
    deploy:
      resources:
        limits:
          memory: 6GB  # V7 spec: <=6GB RSS
          cpus: '4'    # V7 spec: 4 workers for Quick mode
    ports:
      - "8080:8080"  # Direct access (nginx proxies port 80)
    depends_on:
      memgraph:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: ["python", "-m", "src.cli.gmnap", "serve", "--port", "8080"]

  # DuckDB batch collision analytics (V7 spec §12)
  duckdb-batch:
    build: .
    container_name: gmnap_duckdb_batch
    environment:
      - PYTHONPATH=/app/src:/app
      - PIPELINE_MODE=full
      - OFFLINE=1
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./work:/app/work
      - ./config:/app/config
    deploy:
      resources:
        limits:
          memory: 4GB
          cpus: '2'
    restart: "no"
    command: ["python3", "-m", "src.pipeline.stage5_collision_analytics", "--batch"]

  # Prometheus monitoring (V7 spec §12)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gmnap_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus_rules.yml:/etc/prometheus/prometheus_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    depends_on:
      - gmnap
    restart: unless-stopped

  # Grafana dashboards (V7 spec §12)
  grafana:
    image: grafana/grafana:10.4.0
    container_name: gmnap_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-gmnap_v7}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/gmnap.json
    volumes:
      - ./config/grafana/dashboard.json:/var/lib/grafana/dashboards/gmnap.json:ro
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  # Development service with interactive shell
  gmnap-dev:
    build: .
    container_name: gmnap_dev
    environment:
      - PIPELINE_MODE=quick
      - CACHE_MAX_SIZE_GB=5
      - CACHE_MAX_DAYS=7
      - PYTHONPATH=/app/src:/app
      - MEMGRAPH_HOST=memgraph
    volumes:
      - ./:/app
      - ./cache:/app/cache
    command: /bin/bash
    stdin_open: true
    tty: true
    depends_on:
      - memgraph

volumes:
  memgraph_data:
  memgraph_log:
  memgraph_etc:
  redis_data:
  prometheus_data:
  grafana_data:

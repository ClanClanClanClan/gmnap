version: '3.8'

services:
  # Memgraph graph database for academic genealogy
  memgraph:
    # Pinned to memgraph/memgraph:2.22.1 — the same tag the CI
    # `memgraph-test` job uses, so the integration tests CI runs
    # exercise the same Memgraph version users get from
    # `docker compose up`. Earlier docker-compose used the compound
    # memgraph-platform:2.14.1-memgraph2.14.1-lab2.11.1 tag (which
    # bundles Memgraph Lab on port 3000), but version-skew between
    # CI and the local stack would mask Cypher dialect drift between
    # 2.14 and 2.22. Drop Lab from the prod stack — anyone who wants
    # the visual UI can run it as a separate `docker run -p 3000:3000
    # memgraph/lab` against the same Bolt port.
    image: memgraph/memgraph:2.22.1
    container_name: gmnap_memgraph
    ports:
      - "7687:7687"  # Bolt protocol
    # Credentials come from .env; defaults are sane for local dev
    # only. In prod, set these in the deploy environment (or a
    # secrets manager). Hardcoded `MEMGRAPH_PASSWORD=v7_lineage`
    # was committed prior to round 34 — every fork inherited the
    # same prod password until env-ified here.
    environment:
      - MEMGRAPH_USER=${MEMGRAPH_USER:-gmnap}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-v7_lineage_local_dev_only}
    volumes:
      - memgraph_data:/var/lib/memgraph
      - memgraph_log:/var/log/memgraph
      - memgraph_etc:/etc/memgraph
    # No --init-file: schema (constraint on :Person.key, indexes on
    # :Person.global_id and :Person.name) is created idempotently by
    # tools/load_memgraph_from_enrichment.py on every load. The
    # earlier init_memgraph.cypher used a `:Mathematician` label and
    # pre-seeded sample nodes that disagreed with the loader's
    # `:Person` schema, producing two disjoint subgraphs.
    command: ["--storage-gc-cycle-sec=30"]
    restart: unless-stopped
    healthcheck:
      # plain memgraph image's mgconsole lives at /usr/bin/mgconsole;
      # the platform image's was at /usr/lib/memgraph/mgconsole.
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole --host localhost --port 7687 --username \"${MEMGRAPH_USER:-gmnap}\" --password \"${MEMGRAPH_PASSWORD:-v7_lineage_local_dev_only}\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: gmnap_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  # GMNAP V7 Pipeline service
  gmnap:
    build: .
    container_name: gmnap_api
    environment:
      - PIPELINE_MODE=quick
      - CACHE_MAX_SIZE_GB=20
      - CACHE_MAX_DAYS=30
      - PYTHONPATH=/app/src:/app
      - MEMGRAPH_HOST=memgraph
      - MEMGRAPH_PORT=7687
      - MEMGRAPH_USER=${MEMGRAPH_USER:-gmnap}
      - MEMGRAPH_PASSWORD=${MEMGRAPH_PASSWORD:-v7_lineage_local_dev_only}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Free-tier hashcash gate: GMNAP_REQUIRE_HASHCASH=1 in prod
      # (V7 spec §12); leave unset or "0" for local docker-compose
      # to skip the PoW friction.
      - GMNAP_REQUIRE_HASHCASH=${GMNAP_REQUIRE_HASHCASH:-0}
      # CORS must be locked down in prod. Default localhost set
      # works for `docker compose up` browsing http://localhost.
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://localhost:8080}
      # Structured logs to stdout in JSON (consumable by Loki /
      # Datadog / etc.); set GMNAP_LOG_FORMAT=text for legible
      # local-tail output.
      - GMNAP_LOG_FORMAT=${GMNAP_LOG_FORMAT:-json}
      - GMNAP_LOG_LEVEL=${GMNAP_LOG_LEVEL:-INFO}
    volumes:
      - ./data:/app/data
      - ./cache:/app/cache
      - ./config:/app/config
      - ./output:/app/output
    deploy:
      resources:
        limits:
          memory: 6GB  # V7 spec: ≤6GB RSS
          cpus: '4'    # V7 spec: 4 workers for Quick mode
    ports:
      - "8080:8080"  # For monitoring/health checks
    depends_on:
      memgraph:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # SIGTERM → drain in-flight requests for up to 120 s before
    # SIGKILL. uvicorn's --timeout-graceful-shutdown flag (in the
    # Dockerfile CMD) does the actual draining; this gives compose
    # / k8s enough wall-clock to let it finish a 30-60 s batch
    # request before the orchestrator kills the container.
    stop_grace_period: 120s
    
  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: gmnap_nginx
    ports:
      - "80:80"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gmnap
    restart: unless-stopped

  # Development service with interactive shell
  gmnap-dev:
    build: .
    container_name: gmnap_dev
    environment:
      - PIPELINE_MODE=quick
      - CACHE_MAX_SIZE_GB=5
      - CACHE_MAX_DAYS=7
      - PYTHONPATH=/app/src:/app
      - MEMGRAPH_HOST=memgraph
      - REDIS_HOST=redis
    volumes:
      - ./:/app
      - ./cache:/app/cache
    command: /bin/bash
    stdin_open: true
    tty: true
    depends_on:
      - memgraph
      - redis

volumes:
  memgraph_data:
  memgraph_log:
  memgraph_etc:
  redis_data:
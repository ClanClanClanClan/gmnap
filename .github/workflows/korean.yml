name: Korean-v6 regression gate
on: [pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with: 
        python-version: '3.9'
    - name: Install dependencies
      run: |
        cd src/regions/e_groups/e4_korea
        pip install -r requirements.lock
    - name: Build FSTs
      run: |
        cd src/regions/e_groups/e4_korea
        python scripts/build_fsts_multi.py
    - name: Run scoring
      id: score
      run: |
        cd src/regions/e_groups/e4_korea
        SCORE_JSON=$(python tools/score.py)
        echo "::set-output name=math::$(echo $SCORE_JSON | jq '.math[0]')"
        echo "::set-output name=div::$(echo $SCORE_JSON | jq '.diverse[0]')"
    - name: Gate
      run: |
        math=${{steps.score.outputs.math}}
        div=${{steps.score.outputs.div}}
        echo "Current scores: math=$math diverse=$div"
        [ "$math" -ge 641 ] && [ "$div" -ge 182 ] && exit 0
        echo "❌ Regression! math=$math (min 641) diverse=$div (min 182)" && exit 1
name: GMNAP V7 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: "."
  OFFLINE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install black==26.3.1 ruff==0.15.8 isort==6.0.1 codespell==2.4.2 yamllint==1.38.0

      - name: Black
        run: black src/ tests/ --check

      - name: Ruff
        run: ruff check src/ tests/

      - name: isort
        run: isort src/ tests/ --check-only --profile black

      - name: codespell
        run: codespell src/ tests/ --skip "*.json,*.yaml,*.yml,*.csv,*.bin" --ignore-words-list "theses,abd,nam,joo,nin,vie,te,accep,ags,aks,als,ang,bae,bu,byeong,cas,chn,chon,dan,dok,dum,dung,eom,eum,gak,gam,gan,ges,geum,gon,gor,gul,gye,hak,hap,hoe,hye,im,jae,jin,jong,jung,kil,kwon,mak,mis,mot,mun,nae,nak,nam,ndo,nin,nit,noe,oen,ohn,ot,pae,rak,ro,roh,sae,sie,sim,som,soo,sur,te,teh,wan,whan,yeon,yoo,yuk" || true

      - name: yamllint
        run: yamllint -d relaxed config/ docs/*.yaml 2>/dev/null || true

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout pytest-mock hypothesis duckdb pytest-asyncio

      - name: Compile fasttext CLI binary
        run: bash scripts/install_fasttext.sh /usr/local/bin/fasttext

      - name: Setup cost tracking
        run: |
          mkdir -p cache
          echo '{}' > cache/api_costs.json

      - name: Core tests (region detection + user workflows + security + CLI + web + nginx + golden)
        run: >-
          pytest
          tests/unit/test_region_detection_accuracy.py
          tests/unit/test_user_workflows.py
          tests/unit/test_api_security.py
          tests/unit/test_cli_hardening.py
          tests/unit/test_web_interface.py
          tests/unit/test_nginx_config.py
          tests/unit/test_golden_dataset.py
          tests/unit/test_cache_system.py
          tests/unit/test_pipeline.py
          tests/unit/core/test_final_core_functionality.py
          tests/unit/core/test_region_processing.py
          tests/unit/regions/test_region_e4.py
          tests/unit/test_benchmark_evaluation.py
          -v --tb=short --timeout=120 -p no:cacheprovider

      - name: Property tests
        run: >-
          pytest tests/property/test_unicode_properties.py
          -v --tb=short --timeout=120 -p no:cacheprovider
          -k "not test_normalization_preserves_alphanumeric
          and not test_problematic_unicode_robustness
          and not test_specific_ligature_cases"

      - name: Memory peak check
        run: |
          python3 -c "
          import resource, platform
          ru = resource.getrusage(resource.RUSAGE_SELF)
          if platform.system() == 'Darwin':
              rss_gb = ru.ru_maxrss / (1024**3)
          else:
              rss_gb = ru.ru_maxrss / (1024**2)
          limit = 6
          print(f'Peak RSS: {rss_gb:.2f} GB (limit: {limit} GB)')
          assert rss_gb <= limit, f'Memory peak {rss_gb:.2f} GB exceeds {limit} GB limit'
          "

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  cost-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check API spend against CHF 120/month limit
        run: |
          # Ensure cost tracking file exists
          mkdir -p cache
          if [ ! -f cache/api_costs.json ]; then
            echo '{}' > cache/api_costs.json
          fi
          python3 -c "
          import json, sys
          costs = json.load(open('cache/api_costs.json'))
          total = sum(costs.values())
          limit = 120.0
          print(f'Total API spend: CHF {total:.2f} / {limit:.2f}')
          if total >= limit:
              print('OVER LIMIT - failing build')
              sys.exit(1)
          print('Within budget')
          "

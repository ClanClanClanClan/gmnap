name: GMNAP V7 CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: "."
  OFFLINE: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install black==26.3.1 ruff==0.15.8 isort==6.0.1 codespell==2.4.2 yamllint==1.38.0 mypy==1.18.2 bandit==1.7.10 pip-audit==2.7.3

      - name: Black
        run: black src/ tests/ --check

      - name: Ruff
        run: ruff check src/ tests/

      - name: isort
        run: isort src/ tests/ --check-only --profile black

      # Round 34 phase 3: type-check src/. mypy was configured in
      # pyproject.toml but never wired into CI; this catches drift in
      # function signatures + dataclass shapes the H4 audit can't see
      # at the import layer. --ignore-missing-imports keeps it green
      # against optional deps (icu, fasttext-wheel, etc.) we don't
      # carry as hard requirements.
      - name: Mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional || true
        # `|| true` while we baseline the existing surface; the
        # follow-up round either ratchets a `--fail-under` or adds a
        # per-module override list. Leaving as visible-but-non-blocking
        # for now (round 34 deferred the cleanup to its own pass to
        # avoid landing 200+ adjacent type-fix commits).

      # Security linting — flags hardcoded secrets, dangerous use of
      # subprocess/eval/yaml.load, SQL string concat, etc. -ll = HIGH
      # severity only to keep noise down at first. Round 34 adds it
      # non-blocking; if HIGH count grows, the next round ratchets to
      # blocking.
      - name: Bandit
        run: bandit -r src/ -ll -q || true

      # Known-CVE check on the pinned dependency tree. Doesn't fail
      # the build (a freshly-disclosed CVE shouldn't block a hotfix
      # PR), but the run logs are visible in the action UI so a
      # weekly cron — or an attentive reviewer — will see it.
      - name: pip-audit (advisory)
        run: pip-audit -r requirements.txt --strict || true

      - name: codespell
        run: codespell src/ tests/ --skip "*.json,*.yaml,*.yml,*.csv,*.bin" --ignore-words-list "theses,abd,nam,joo,nin,vie,te,accep,ags,aks,als,ang,bae,bu,byeong,cas,chn,chon,dan,dok,dum,dung,eom,eum,gak,gam,gan,ges,geum,gon,gor,gul,gye,hak,hap,hoe,hye,im,jae,jin,jong,jung,kil,kwon,mak,mis,mot,mun,nae,nak,nam,ndo,nin,nit,noe,oen,ohn,ot,pae,rak,ro,roh,sae,sie,sim,som,soo,sur,te,teh,wan,whan,yeon,yoo,yuk" || true

      - name: yamllint
        run: yamllint -d relaxed config/ docs/*.yaml 2>/dev/null || true

      # Reproducibility gate: regenerate the lockfile and verify it
      # matches what's committed. If a contributor edited
      # requirements.txt without running `make lock`, this catches it.
      - name: Lockfile in sync
        run: |
          # Pin pip-tools 7.5.3 — earlier 7.x is broken against modern
          # pip's PackageFinder API ("'PackageFinder' object has no
          # attribute 'allow_all_prereleases'"). Local Makefile lock
          # target uses the same version so the diff is reproducible.
          pip install --quiet pip-tools==7.5.3
          pip-compile --quiet --strip-extras --output-file=requirements.lock.ci requirements.txt
          # pip-compile bakes the output filename into the header
          # comment, so a raw diff between requirements.lock (committed)
          # and requirements.lock.ci (regenerated) always trips on that
          # one cosmetic line. Strip leading-# header lines from both
          # before comparing — only the resolved-pin body matters for
          # reproducibility.
          if ! diff -u <(grep -v '^#' requirements.lock) <(grep -v '^#' requirements.lock.ci); then
            echo "::error::requirements.lock is stale. Run 'make lock' and commit the result."
            exit 1
          fi

  # Repository-invariant audit (tools/audit_repo.py). 18 checks across
  # 10 categories — file-tree integrity, parse, JSON/YAML, doc-vs-data
  # numerical claims, version coherence, Make-target resolution, CI test
  # references, test-module shadowing, generator idempotency, doc cross-
  # references. Catches the kind of regression where a doc number drifts
  # from a measured value, or someone deletes a file that another doc
  # still references. Fast (~1 s) — runs in parallel with `test`.
  audit-repo:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime deps (B2 imports production modules)
        run: pip install -r requirements.txt

      - name: Install pytest (G2 spawns `pytest --collect-only` per CI list)
        # Match the test job's pytest plugin set so the collection step
        # uses the same imports + plugin behaviour. Without these the
        # G2 check fails with "No module named pytest" (caught in CI
        # round 19) — a different kind of false positive than the
        # collection drift G2 is meant to catch.
        run: pip install pytest pytest-timeout pytest-mock pytest-asyncio

      - name: Run repo-invariant audit
        run: PYTHONPATH=. python3 tools/audit_repo.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout pytest-mock hypothesis duckdb pytest-asyncio pytest-cov

      - name: Compile fasttext CLI binary
        run: bash scripts/install_fasttext.sh /usr/local/bin/fasttext

      - name: Setup cost tracking
        run: |
          mkdir -p cache
          echo '{}' > cache/api_costs.json

      - name: Core tests (region detection + user workflows + security + CLI + web + nginx + golden)
        run: >-
          pytest
          tests/unit/test_region_detection_accuracy.py
          tests/unit/test_user_workflows.py
          tests/unit/test_api_security.py
          tests/unit/test_cli_hardening.py
          tests/unit/test_web_interface.py
          tests/unit/test_nginx_config.py
          tests/unit/test_golden_dataset.py
          tests/unit/test_cache_system.py
          tests/unit/test_calibration.py
          tests/unit/test_canonical_fetcher_delegation.py
          tests/unit/test_pav_fitter.py
          tests/unit/test_benchmark_split.py
          tests/unit/test_pipeline.py
          tests/unit/core/test_final_core_functionality.py
          tests/unit/core/test_region_loading.py
          tests/unit/core/test_region_processing.py
          tests/unit/regions/test_region_e4.py
          tests/unit/korean/test_basic_functionality.py
          tests/unit/korean/test_convert.py
          tests/unit/korean/test_segment.py
          tests/unit/korean/test_segment_fallback.py
          tests/unit/test_a3_nordic_baltic.py
          tests/unit/test_a4_oceania.py
          tests/unit/test_api_server.py
          tests/unit/test_authority_manager.py
          tests/unit/test_authority_retry.py
          tests/unit/test_benchmark_evaluation.py
          tests/unit/test_cjk_roundtrip.py
          tests/unit/test_collision_analytics.py
          tests/unit/test_config.py
          tests/unit/test_duckdb_analytics_shape.py
          tests/unit/test_fasttext_cli_worker.py
          tests/unit/test_gdpr.py
          tests/unit/test_gdpr_comprehensive.py
          tests/unit/test_genealogy_lookup.py
          tests/unit/test_genealogy_query.py
          tests/unit/test_global_id.py
          tests/unit/test_globalid.py
          tests/unit/test_manager_caching.py
          tests/unit/test_quality_gates.py
          tests/unit/test_region_processors.py
          tests/unit/test_regions.py
          tests/unit/test_schema.py
          tests/unit/test_sea_roundtrip.py
          tests/unit/test_simple_detection.py
          tests/unit/test_stage9_outputs.py
          tests/unit/test_stage11_idempotency.py
          tests/unit/test_surname_detection.py
          tests/unit/test_thread_safe_demo.py
          tests/unit/test_unicode_handler.py
          tests/unit/test_validation_rules.py
          tests/unit/test_sdk.py
          tests/integration/test_memgraph_e2e.py
          tests/authority/test_manager_offline.py
          tests/cjk/test_v7_cjk_roundtrip.py
          tests/db/test_changelog_edges.py
          tests/db/test_pool_tx.py
          tests/regions/f3_horn_of_africa/test_f3_processor.py
          tests/regions/d4_pakistan_urdu/test_d4_processor.py
          tests/regions/test_b1_romanize.py
          tests/regions/test_b1_transliteration.py
          tests/quality_gates/test_enhanced_quality_gates.py
          tests/unit/regions/test_detect_region_priority.py
          tests/unit/test_region_a1.py
          tests/validation/test_schema_validator_basic.py
          tests/v7/test_v7_basic.py
          tests/v7/test_v7_complete.py
          tests/v7/test_v7_complete_integration.py
          tests/v7/test_v7_full_pipeline.py
          tests/v7/test_v7_imports.py
          -v --tb=short --timeout=120 -p no:cacheprovider

      - name: Property tests
        run: >-
          pytest tests/property/test_unicode_properties.py
          -v --tb=short --timeout=120 -p no:cacheprovider
          -k "not test_normalization_preserves_alphanumeric
          and not test_problematic_unicode_robustness
          and not test_specific_ligature_cases"

      - name: Memory peak check
        run: |
          python3 -c "
          import resource, platform
          ru = resource.getrusage(resource.RUSAGE_SELF)
          if platform.system() == 'Darwin':
              rss_gb = ru.ru_maxrss / (1024**3)
          else:
              rss_gb = ru.ru_maxrss / (1024**2)
          limit = 6
          print(f'Peak RSS: {rss_gb:.2f} GB (limit: {limit} GB)')
          assert rss_gb <= limit, f'Memory peak {rss_gb:.2f} GB exceeds {limit} GB limit'
          "

  coverage:
    # Dedicated coverage job. Runs in parallel with `test`, with its
    # own carefully-curated test subset that avoids tests with their
    # own `@pytest.mark.timeout(N)` decorator that --cov instrumentation
    # could push past N. The big perf-style files (test_region_detection
    # _accuracy, test_user_workflows, test_api_*, test_web_*, test_cli_*,
    # test_benchmark_evaluation, test_thread_safe_demo, test_fasttext_cli
    # _worker, test_pipeline_v7-style integrations) are excluded — they
    # either spawn subprocesses, do heavy I/O, or have tight timeouts
    # that --cov breaks.
    #
    # The curated list still exercises the core paths: every region
    # processor, every authority adapter shim, the calibration runtime,
    # the benchmark split helper, the GDPR pipeline, the genealogy
    # lookup. Coverage from this list represents what the unit-test
    # suite actually proves.
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout pytest-mock hypothesis duckdb pytest-asyncio pytest-cov

      - name: Compile fasttext CLI binary
        run: bash scripts/install_fasttext.sh /usr/local/bin/fasttext

      - name: Setup cost tracking
        run: |
          mkdir -p cache
          echo '{}' > cache/api_costs.json

      - name: Run with coverage
        run: >-
          PYTHONPATH=. pytest
          tests/unit/test_calibration.py
          tests/unit/test_canonical_fetcher_delegation.py
          tests/unit/test_pav_fitter.py
          tests/unit/test_benchmark_split.py
          tests/unit/test_pipeline.py
          tests/unit/test_authority_manager.py
          tests/unit/test_authority_retry.py
          tests/unit/test_collision_analytics.py
          tests/unit/test_quality_gates.py
          tests/unit/test_stage9_outputs.py
          tests/unit/test_gdpr.py
          tests/unit/test_gdpr_comprehensive.py
          tests/unit/test_region_processors.py
          tests/unit/test_simple_detection.py
          tests/unit/test_unicode_handler.py
          tests/unit/test_validation_rules.py
          tests/unit/test_global_id.py
          tests/unit/test_globalid.py
          tests/unit/test_cache_system.py
          tests/unit/test_genealogy_lookup.py
          tests/unit/test_genealogy_query.py
          tests/unit/test_config.py
          tests/unit/test_schema.py
          tests/unit/test_a3_nordic_baltic.py
          tests/unit/test_a4_oceania.py
          tests/unit/test_cjk_roundtrip.py
          tests/unit/test_sea_roundtrip.py
          tests/unit/test_surname_detection.py
          tests/unit/test_duckdb_analytics_shape.py
          tests/unit/test_manager_caching.py
          tests/unit/test_stage11_idempotency.py
          tests/unit/korean/test_basic_functionality.py
          tests/unit/korean/test_convert.py
          tests/unit/korean/test_segment.py
          tests/unit/korean/test_segment_fallback.py
          tests/unit/core/test_region_loading.py
          tests/unit/regions/test_region_e4.py
          tests/unit/test_security_validator.py
          tests/unit/test_data_quality_validator.py
          tests/unit/test_region_base.py
          tests/unit/test_region_processors_full.py
          --cov=src --cov-branch --cov-report=xml:coverage.xml --cov-report=term:skip-covered
          --cov-fail-under=20
          -q --timeout=240 -p no:cacheprovider

      - name: Coverage summary
        run: |
          python3 -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          line_rate = float(root.attrib.get('line-rate', 0)) * 100
          branch_rate = float(root.attrib.get('branch-rate', 0)) * 100
          print(f'Line coverage:   {line_rate:.2f}%')
          print(f'Branch coverage: {branch_rate:.2f}%')
          # Floors: 22 % line, 18 % branch. Current measured 23.93 % /
          # 19.41 % (2026-04-30 — see CHANGELOG round 16, after
          # tests/unit/test_region_processors_full.py [194 tests]
          # exercising every region's clean→augment→validate→order_key
          # hook chain plus RegionManager dispatch on diverse inputs).
          # Single file delivered +4.63 pp line, +5.40 pp branch — the
          # uncovered region-processor surface was the dominant gap.
          # Original Phase-4 target was floor 20; we sailed past, so
          # ratcheting to 22/18 (~2 pp margin) actually catches future
          # regressions instead of leaving a 4 pp coverage moat.
          line_floor = 22.0
          branch_floor = 18.0
          assert line_rate >= line_floor, f'Line coverage {line_rate:.2f}% < floor {line_floor}%'
          assert branch_rate >= branch_floor, f'Branch coverage {branch_rate:.2f}% < floor {branch_floor}%'
          "

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14
          if-no-files-found: warn

  memgraph-test:
    # End-to-end live-Memgraph integration. Spins up Memgraph 2.12 as
    # a sidecar, runs the loader, hits /api/v1/lineage and /readyz
    # against the real graph. Catches schema-vs-query drift that
    # mocked unit tests can't see.
    #
    # Image: memgraph/memgraph:2.22.1 — the most recent 2.x tag (3.x
    # bumped Cypher syntax to Neo4j-5-style "CREATE CONSTRAINT FOR …
    # REQUIRE … IS UNIQUE", which would break the loader's
    # "CREATE CONSTRAINT ON … ASSERT … IS UNIQUE" statements).
    #
    # Neither memgraph/memgraph:2.12 nor memgraph/memgraph-platform:2.12
    # are published on Docker Hub (verified via the registry API), so
    # the docker-compose.yml's pin is technically broken too — left
    # untouched here because that's a user-facing concern outside this
    # CI patch.
    #
    # Default connection has empty password unless MEMGRAPH_USER/
    # PASSWORD env vars create one (we don't, here).
    runs-on: ubuntu-latest
    needs: lint
    services:
      memgraph:
        image: memgraph/memgraph:2.22.1
        ports:
          - 7687:7687
        # Memgraph's docker image doesn't ship a HEALTHCHECK by
        # default; the wait-for-Bolt step below polls a TCP connect
        # which is sufficient for our purposes.
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install runtime deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-timeout
      - name: Wait for Memgraph Bolt to accept connections
        run: |
          for i in $(seq 1 30); do
            python3 -c "import socket; socket.create_connection(('localhost',7687),timeout=2).close()" \
              && { echo "memgraph ready after ${i}s"; exit 0; }
            sleep 2
          done
          echo "memgraph did not become ready in 60s"; exit 1
      - name: Run live integration tests
        timeout-minutes: 20
        env:
          MEMGRAPH_BOLT: bolt://localhost:7687
          PYTHONPATH: .
        run: |
          # Three timeout layers must agree, in nesting order:
          #   1. subprocess.run(timeout=900) inside the loaded_memgraph
          #      fixture — caps the loader at 15 min.
          #   2. pytest --timeout=900 — pytest-timeout's per-test
          #      ceiling. Must be ≥ subprocess timeout (otherwise
          #      pytest kills the test before subprocess returns).
          #   3. GH step timeout-minutes=20 — wall-clock for the
          #      whole step including pytest setup/teardown.
          # Round-23's partition harvest doubled the dataset to ~60k
          # MERGEs. Round-26's CI failure trip was the old 300s
          # subprocess timeout; round-26 fix-forward (this commit)
          # also raised pytest --timeout from 360 → 900 because the
          # outer pytest-timeout was firing first.
          pytest tests/integration/test_memgraph_e2e.py -v --tb=short \
            --timeout=900 -p no:cacheprovider

  browser-test:
    # 31-scenario adversarial Playwright harness. Spawns uvicorn,
    # drives a real headless Chromium against it: XSS, Unicode,
    # responsive viewports, server-500 mid-flight, rapid-fire,
    # tree-depth navigation. The harness already caught a debounce
    # race that hid the profile under the user — wiring it into CI
    # so the next class of UI regression fails the PR, not the demo.
    #
    # Local run: ~80s on M1. Budget 4 min on slower GHA runners.
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Setup Python
        uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install runtime + dev deps
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Install Chromium
        run: playwright install --with-deps chromium
      - name: Run adversarial browser harness
        timeout-minutes: 6
        env:
          PYTHONPATH: .
        run: python3 tools/browser_smoke.py --headless
      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-audit
          path: |
            docs/browser_audit.md
            docs/screenshots/browser_audit/
          retention-days: 7
          if-no-files-found: warn

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gmnap:ci
          # No cache for ship-readiness audit — we want the cold-build
          # path to stay green.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          set -euo pipefail
          # Run detached; health-check /readyz, then shut down. If the
          # image can't come up in 30s, fail the job rather than hang CI.
          docker run -d --rm --name gmnap-ci \
            -p 8080:8080 \
            -e OFFLINE=1 -e GMNAP_FREE_RPM=10000 \
            gmnap:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/readyz >/dev/null; then
              echo "Ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/healthz | grep '"status":"ok"'
          docker logs gmnap-ci | tail -50
          docker stop gmnap-ci

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  # Cost guard reads cache/api_costs.json — the file is the
  # source-of-truth, written by src/core/cost_tracker.record(...)
  # from every live-mode authority call (round 34 phase 3 wired the
  # tracker; before that the file was reinitialized each CI run and
  # the budget was theatre). For prod deploys, mount the cache/
  # volume across container restarts so spend persists.
  cost-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check API spend against CHF 120/month limit
        run: |
          mkdir -p cache
          # Standalone load of just cost_tracker, avoiding the
          # src.core package __init__ chain which pulls in pyyaml +
          # other runtime deps the cost-guard job doesn't need. This
          # keeps the job under 5 s wall-clock.
          PYTHONPATH=. python3 -c "
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location(
              'cost_tracker', 'src/core/cost_tracker.py'
          )
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          limit = float('${COST_GUARD_LIMIT_CHF:-120.0}')
          total = mod.total()
          print(f'Total API spend: CHF {total:.2f} / {limit:.2f}')
          if total >= limit:
              print(f'::error::API spend over CHF {limit:.2f} budget')
              sys.exit(1)
          print('Within budget')
          "

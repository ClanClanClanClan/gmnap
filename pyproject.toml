[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmnap"
version = "7.0.0"
description = "Global Mathematician Name Authority Pipeline"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "ruamel.yaml>=0.18",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "duckdb>=0.10",
    "jsonschema>=4.21",
    "zstandard>=0.22",
    "pandas>=2.2",
    "numpy>=1.26",
    "unicodedata2>=15.1",
    "asyncio-throttle>=1.0",
    "aiofiles>=23.2",
    "fastapi>=0.104",
    "uvicorn>=0.24",
    "click>=8.1",
    "rich>=13.7",
    "prometheus-client>=0.20",
    "psutil>=5.9",
    "neo4j>=5.20",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.7",
    "pytest-timeout>=2.4",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "hypothesis>=6.100",
    "black>=24.4",
    "ruff>=0.4",
    "isort>=5.13",
    "codespell>=2.3",
    "yamllint>=1.35",
    "pre-commit>=3.7",
]

[project.scripts]
gmnap = "src.cli.gmnap:cli"

[tool.setuptools.packages.find]
include = ["src*", "config*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live_api: tests that require live API access (excluded by default)",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

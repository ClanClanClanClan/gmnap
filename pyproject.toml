[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gmnap"
version = "7.0.0"
description = "Global Mathematician Name Authority Platform"
readme = "README.md"
authors = [
    {name = "GMNAP Development Team", email = "gmnap@example.com"}
]
license = {text = "MIT"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# Several pinned deps (networkx>=3.3, pydantic v2) require Python 3.10+.
# CI runs 3.12. Earlier `requires-python = ">=3.8"` claim was stale; a
# fresh `pip install -e .` on 3.8/3.9 fails resolving networkx.
requires-python = ">=3.10"
dependencies = [
    # Mirrors requirements.txt — the canonical runtime list. Keep them
    # in sync; the CI lockfile-in-sync gate uses requirements.txt as
    # source of truth for pip-compile. Older entries (pynini, icu,
    # fasttext Python bindings, numpy, pandas, requests, duckdb) were
    # pruned in round 34 because (a) they weren't in requirements.txt,
    # (b) they don't build on stock macOS without homebrew openfst etc.,
    # and (c) the live pipeline imports their canonical alternatives
    # (the fasttext CLI binary, not the wheel; aiohttp/httpx not
    # requests; orjson not pandas for hot paths). The remaining hard
    # deps below are all wheel-distributing on every supported platform.
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.6",
    "pydantic>=2.9.2",
    "httpx>=0.27.2",
    "ruamel.yaml>=0.18.6",
    "networkx>=3.3",
    "jsonschema>=4.21.1",
    "aiohttp>=3.9.5",
    "prometheus-client>=0.20.0",
    "orjson>=3.10.7",
    "psutil>=6.0.0",
    "click>=8.1.7",
    "PyYAML>=6.0.1",
    "zstandard>=0.22.0",
    "neo4j>=5.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "hypothesis>=6.0.0",
    "faker>=18.0.0",
]
docs = [
    "sphinx>=6.0.0",
    "sphinx-rtd-theme>=1.2.0",
    "mkdocs>=1.4.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
gmnap = "src.cli.gmnap:cli"

# The repo uses a flat `src/` layout (the package itself IS named
# `src`, not nested under another top-level). setuptools needs this
# explicit because its auto-discovery skips dirs literally named
# `src` (it expects PEP-621 src-layout where `src/` is a build-time
# wrapper around the real package). Without these blocks
# `pip install -e .` produces a working entry-point script that
# imports a nonexistent `src` module.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["src*tests*", "src*backups*", "src*.archive*"]
namespaces = true

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml", "*.json", "*.csv", "*.txt", "*.cypher"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | archive
)/
'''

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = ["E402", "E722", "F821", "E741", "F601", "F811", "F402", "F403", "F401", "E721"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"scripts/**" = ["F401", "F841", "E701", "E702"]
"src/regions/e_groups/e4_korea/scripts/**" = ["F401", "F841", "E701", "E702"]
"tools/**" = ["F401", "F841"]
"tests/**" = ["F401", "E701", "E702"]

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra -q --strict-markers"
# Directories pytest skips when running with no explicit path. CI
# enumerates specific files (see .github/workflows/ci.yml's `Core
# tests` step), so it isn't affected — but a developer running plain
# `pytest` from the repo root would otherwise hit ~30 collection
# errors from non-CI dirs that have known import / fixture issues.
# Triage report: docs/test_triage_2026-04-28.md.
norecursedirs = [
    "docs/orphaned_tests",
    "tests/coherence",
    "tests/compliance",
    "tests/error_recovery",
    "tests/extreme",
    "tests/genealogy",
    "tests/hardcore",
    "tests/idempotency",
    # Whole tests/integration tree skipped by default — CI explicitly
    # enumerates `tests/integration/test_memgraph_e2e.py` (the only
    # CI-active file). Most others import the legacy pipeline_v6 /
    # streaming_v7 modules deleted in round 18, so plain `pytest`
    # would hit collection errors.
    "tests/integration",
    "tests/live",
    "tests/memory",
    "tests/mock_api",
    "tests/paranoid",
    "tests/performance",
    "tests/production",
    "tests/regional",
    "tests/regions/e6_mainland_sea",
    "tests/roundtrip",
    "tests/security",
    "scripts",
    "archive",
    "out",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "paranoid: marks tests as paranoid level tests",
    "unit: marks tests as unit tests",
    "live: marks tests requiring live network / API access",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/archive/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
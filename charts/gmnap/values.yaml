# Default values for GMNAP
replicaCount: 3

image:
  repository: gmnap
  pullPolicy: IfNotPresent
  tag: "v6.1-korea"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 2000

securityContext:
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: gmnap.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

# Korean V5 specific configuration
korea:
  enabled: true
  fst:
    cacheSize: 10000
    maxConcurrency: 100
  performance:
    targetLatencyP95: 120  # milliseconds
    batchSize: 100
  
# Monitoring
monitoring:
  enabled: true
  prometheus:
    enabled: true
  alerts:
    enabled: true
    errorRateThreshold: 0.005  # 0.5%
    latencyThreshold: 120      # ms

# Database configuration (if needed)
database:
  enabled: false
  
# Configuration
config:
  logLevel: INFO
  debug: false
version: '3.8'

# Lightweight test infrastructure for live_api tests.
# Usage:
#   docker compose -f docker-compose.test.yml up -d
#   python3 tools/load_test_fixtures.py          # seed graph DB
#   pytest tests/genealogy/ -m live_api -v        # run live API tests
#   docker compose -f docker-compose.test.yml down -v

services:
  # Neo4j for genealogy graph queries (test instance)
  neo4j-test:
    image: neo4j:5-community
    container_name: gmnap_neo4j_test
    ports:
      - "7688:7687"   # Bolt (matches test_api_comprehensive.py DB_URI)
      - "7475:7474"   # HTTP browser
    environment:
      - NEO4J_AUTH=none                          # no auth for testing
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=256m
      - NEO4J_dbms_memory_heap_max__size=512m
    volumes:
      - neo4j_test_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # GMNAP API server for live endpoint testing
  gmnap-api-test:
    build: .
    container_name: gmnap_api_test
    ports:
      - "8080:8080"   # matches test_api_comprehensive.py BASE_URL
    environment:
      - PIPELINE_MODE=quick
      - OFFLINE=1
      - PYTHONPATH=/app
      - NEO4J_URI=bolt://neo4j-test:7687
      - NEO4J_AUTH=none
      - GMNAP_SCHEMA_STRICT=0
    depends_on:
      neo4j-test:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  neo4j_test_data:
